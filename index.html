<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>ClueBoard 推理の助手</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Meiryo,sans-serif;background:#0d0d1a;color:#e0e0e0;overflow:hidden;height:100vh;display:flex;flex-direction:column;user-select:none}

/* ── MENUBAR ── */
#menubar{background:linear-gradient(135deg,#12122a,#1a1a3e);border-bottom:2px solid #2a2a5a;padding:5px 10px;display:flex;align-items:center;gap:6px;flex-shrink:0;z-index:200;flex-wrap:wrap}
#app-title{font-size:16px;font-weight:bold;color:#c8a8ff;white-space:nowrap;letter-spacing:.05em}
.menu-break{flex-basis:100%;width:100%;height:0;margin:0;padding:0} /* forces the title onto its own row */
/* document title: prominent. empty (placeholder shown) or focused → boxed input; filled & resting → just big text */
#doc-title{background:transparent;border:1px solid transparent;border-radius:6px;color:#fff;font-size:15px;font-weight:700;letter-spacing:.02em;padding:5px 9px;max-width:300px;width:auto;min-width:110px;font-family:inherit;outline:none;text-shadow:0 1px 4px rgba(0,0,0,.35);transition:background .15s,border-color .15s}
#doc-title::placeholder{color:#8a8ad0;font-weight:500;text-shadow:none}
#doc-title:placeholder-shown{background:#1e1e4a;border-color:#5a5a9a}
#doc-title:hover:not(:focus){border-color:#3a3a6a}
#doc-title:focus{background:#0d0d24;border-color:#7a7aff;box-shadow:0 0 0 2px rgba(122,122,255,.18)}
/* file / account slide-in panel (☰ メニュー) */
#file-menu{position:fixed;top:0;right:0;bottom:0;width:min(290px,84vw);z-index:540;
  background:linear-gradient(180deg,rgba(20,20,46,.98),rgba(11,11,24,.98));border-left:2px solid #2a2a5a;
  box-shadow:-6px 0 26px rgba(0,0,0,.55);padding:54px 16px 22px;display:flex;flex-direction:column;gap:11px;
  overflow-y:auto;transform:translateX(100%);transition:transform .25s ease}
body.filemenu-open #file-menu{transform:translateX(0)}
#file-menu .fm-title{font-size:12px;color:#9a9ad0;font-weight:bold;letter-spacing:.06em;padding-bottom:6px;border-bottom:1px solid #2a2a5a}
#file-menu .mbtn{width:100%;min-height:48px;font-size:15px;text-align:left;padding:10px 14px}
#file-menu #cloud-status{font-size:13px;color:#8a8ac0;padding:2px 4px;text-align:center;white-space:normal}
body.filemenu-open #menu-backdrop{display:block}
.menu-sep{width:1px;height:22px;background:#2a2a5a;flex-shrink:0}
.menu-sep.menu-push{width:3px;height:30px;margin:0 9px;background:#7a5aff;border-radius:2px;box-shadow:0 0 6px rgba(122,90,255,.45)} /* the major divider splitting 編集 | 保存 groups */
.mbtn.save-grp{background:#202a4d;border-color:#46568c} /* 保存/ファイル/アカウント group — distinct tint from the edit tools */
.mbtn.save-grp:hover{background:#2c3a66;border-color:#6a7ab0}
.mbtn{background:#1e1e4a;border:1px solid #3a3a6a;color:#d0d0ff;padding:4px 8px;border-radius:6px;cursor:pointer;font-size:12px;transition:all .15s;white-space:nowrap;font-family:inherit}
.mbtn:hover{background:#2a2a6a;border-color:#6a6aaa}
.mbtn.active{background:#6a3aaa;border-color:#9a6aff;color:#fff}
.mbtn.danger:hover{background:#8b2020;border-color:#ff5555;color:#fff}
.mbtn:disabled{opacity:.35;cursor:default;background:#15152e}
.mbtn:disabled:hover{background:#15152e;border-color:#3a3a6a}
#bg-sel{background:#1e1e4a;border:1px solid #3a3a6a;color:#d0d0ff;padding:4px 6px;border-radius:6px;font-size:12px;cursor:pointer;font-family:inherit}
#bg-sel option{background:#1e1e4a}
#btn-login.in{background:#1e4a2e;border-color:#3a9a5a}
#cloud-status{font-size:11px;color:#8a8ac0;white-space:nowrap;align-self:center}

/* ── CONTENT / SIDEBAR / CANVAS ── */
#content{flex:1;display:flex;min-height:0;position:relative}
#canvas-wrap{flex:1;min-width:0;overflow:hidden;position:relative;cursor:default;touch-action:none}
.card,.branch,.subtitle,.imgel,.desc-box,.card-add-btn,.q-item{touch-action:none}
#canvas-inner{position:absolute;top:0;left:0;transform-origin:0 0}
/* sidebar = floating HUD over the canvas; only the cards capture clicks, the empty area is click-through */
#sidebar{position:absolute;left:0;top:0;bottom:0;width:272px;display:flex;flex-direction:column;z-index:150;pointer-events:none;overflow:visible}
#sidebar-right{position:absolute;right:0;top:0;bottom:0;width:272px;display:flex;flex-direction:column;z-index:150;pointer-events:none;overflow:visible}
#q-list,#q-list-right{padding:10px 8px 28px;pointer-events:auto;overflow-y:auto;flex:1;min-height:0;overscroll-behavior:contain}
.q-item{display:flex;align-items:center;gap:8px;padding:9px 10px;margin-bottom:6px;border-radius:8px;background:#16162e;border:1px solid #2a2a5a;cursor:pointer;color:#d0d0ff;font-size:13px;transition:background .15s,border-color .15s;pointer-events:auto;box-shadow:0 2px 10px rgba(0,0,0,.4)}
.q-item:hover{background:#1e1e44;border-color:#4a4a8a}
.q-item.active{background:#2a1e55;border-color:#9a6aff;color:#fff}
.q-item .q-ico{flex-shrink:0}
.q-item .q-title{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.q-item .q-del{opacity:0;color:#ff8888;flex-shrink:0;padding:0 3px;font-size:12px}
.q-item:hover .q-del{opacity:.65}
.q-item .q-del:hover{opacity:1}
.q-item.q-add-item{background:rgba(18,18,42,.82);border:1px dashed #5a5a9a;color:#c8a8ff;justify-content:center;font-size:18px;line-height:1}
.q-item.q-add-item:hover{background:#1e1e44;border-color:#8a8aca}
.q-item.q-drag-h{cursor:grab}
.q-item.q-dragging{opacity:.4}
.q-item.q-over-top{box-shadow:inset 0 3px 0 #c8a8ff,0 2px 10px rgba(0,0,0,.4)}
.q-item.q-over-bottom{box-shadow:inset 0 -3px 0 #c8a8ff,0 2px 10px rgba(0,0,0,.4)}
/* section toggle row (show/hide all) */
.q-section{display:flex;justify-content:space-between;align-items:center;padding:9px 10px 3px;font-size:11px;font-weight:bold;color:#9a9ad0;letter-spacing:.06em;pointer-events:auto;cursor:pointer;user-select:none}
.q-section:hover{color:#c8a8ff}
.q-section .q-eye{font-size:13px;opacity:.85}
.q-section.off{color:#6a6a8a}
/* clue (手がかり) card: name + image/icon thumbnail */
.clue-item .clue-thumb{flex-shrink:0;width:26px;height:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:15px;overflow:hidden;color:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4)}
.clue-item .clue-thumb img{width:100%;height:100%;object-fit:cover}

/* backgrounds — applied to #canvas-wrap; size/position driven by pan & zoom */
.bg-grid{background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px)}
.bg-dots{background-image:radial-gradient(circle,rgba(255,255,255,.22) 1.4px,transparent 1.4px)}
.bg-plain{background-image:none}

#svg-layer{position:absolute;top:-8800px;left:-8800px;width:17600px;height:17600px;overflow:visible;pointer-events:none}
#svg-layer .ahit{pointer-events:stroke;cursor:pointer}
#svg-layer .avis{pointer-events:none}
#temp-arrow{pointer-events:none}
#elems{position:absolute;top:0;left:0}

/* ── ZONES (svg) ── */

/* ── CARDS ── */
.card{position:absolute;min-width:110px;border-radius:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 12px;transition:box-shadow .15s;overflow:visible}
.card:hover{box-shadow:0 0 0 2px rgba(255,255,255,.4),0 0 20px rgba(150,100,255,.3)}
.card.selected{box-shadow:0 0 0 3px #fff,0 0 24px rgba(200,168,255,.5)!important}
.card.conn-target{box-shadow:0 0 0 3px #4affaa,0 0 20px rgba(74,255,170,.4)!important;cursor:crosshair}
.card-icon-wrap{font-size:32px;margin-bottom:4px;line-height:1}
/* image fills the card width and shows large (preserves aspect, tall images capped) */
/* pointer-events:none so the card (not the img) receives the drag, and no native image drag-ghost */
.card-img{width:100%;height:auto;max-height:280px;object-fit:cover;border-radius:8px;margin-bottom:5px;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
.card.shape-circle .card-img{width:100%;height:100%;border-radius:50%;margin:0}
.card-name{font-weight:bold;font-size:13px;text-align:center;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.6);white-space:pre} /* 改行は明示(\n)のみ */
.card-sub{font-size:11px;color:rgba(255,255,255,.7);text-align:center;margin-top:2px;white-space:pre}
/* unified draggable description box — always horizontal, linked by a dotted line */
.desc-box{position:absolute;background:rgba(10,10,30,.94);color:#cfcfe6;font-size:11px;line-height:1.55;padding:7px 11px;border-radius:8px;width:max-content;min-width:80px;white-space:pre;writing-mode:horizontal-tb;text-orientation:mixed;z-index:45;border:1px dashed rgba(160,150,255,.5);cursor:move;text-align:left;box-shadow:0 4px 16px rgba(0,0,0,.45)} /* 改行は明示(\n=Ctrl+Enter)のみ。自動折返しせず横に伸びる */
.desc-box.hovonly{display:none} /* 解説OFF時はホバーでだけ表示 */
.desc-box.hovonly.hov{display:block;z-index:60}
#svg-layer line.hovonly{visibility:hidden}
#svg-layer line.hovonly.hov{visibility:visible}
.desc-box:hover{border-color:rgba(190,170,255,.9);background:rgba(16,16,40,.97)}
.desc-box.dragging{border-style:solid;border-color:#c8a8ff}
.layer-tag{font-weight:bold;cursor:pointer;pointer-events:auto;text-decoration:underline;text-underline-offset:2px}
.layer-tag:hover{filter:brightness(1.25)}
.card-add-btn{position:absolute;top:-10px;right:-10px;width:22px;height:22px;background:#4a9eff;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:13px;font-weight:bold;color:#fff;z-index:20;border:2px solid #0d0d1a;transition:background .15s;line-height:1}
.card.link-node{outline:2px dashed rgba(255,255,255,.55);outline-offset:2px}
.link-badge{position:absolute;bottom:-11px;left:-11px;width:25px;height:25px;background:#f0a02a;border-radius:50%;display:none;align-items:center;justify-content:center;cursor:pointer;font-size:14px;font-weight:bold;color:#1a1208;z-index:21;border:2px solid #0d0d1a;box-shadow:0 1px 6px rgba(0,0,0,.55);line-height:1} /* 左下（右下はリサイズハンドル用） */
.card.link-node .link-badge{display:flex}
/* 右下リサイズハンドル（全オブジェクト共通） */
.rsz{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:4px;background:#1e1e4a;border:1.5px solid #8a8aff;cursor:nwse-resize;z-index:26;display:none;box-shadow:0 1px 4px rgba(0,0,0,.5)}
.rsz::after{content:'';position:absolute;right:3px;bottom:3px;width:6px;height:6px;border-right:2px solid #c8c8ff;border-bottom:2px solid #c8c8ff}
.card:hover>.rsz,.branch:hover>.rsz,.subtitle:hover>.rsz,.imgel:hover>.rsz,.desc-box:hover>.rsz{display:block}
@media (pointer:coarse){.rsz{display:block;width:24px;height:24px;right:-11px;bottom:-11px}} /* タッチ端末では常時表示 */
.card-add-btn:hover{background:#2277cc}
/* "key" marker badge shown on flagged objects */
.key-badge{position:absolute;top:-18px;left:-18px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:24px;background:#16162e;border:2.5px solid #f5c518;border-radius:50%;z-index:22;pointer-events:none;box-shadow:0 1px 6px rgba(0,0,0,.6),0 0 11px rgba(245,197,24,.45);line-height:1}
/* arrow key badge: positioned at the arrow midpoint (just above the label), same badge style */
.akey-badge{transform:translate(-50%,calc(-100% - 14px))}
.card.shape-circle{border-radius:50%;width:110px;height:110px;padding:8px}
.card.shape-bubble{border-radius:12px}
.card.shape-bubble::after{content:'';position:absolute;bottom:-14px;left:50%;transform:translateX(-50%);border:7px solid transparent;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3))}

/* ── BRANCH NODES ── */
.branch{position:absolute;width:40px;height:40px;border-radius:50%;border:3px solid #fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:bold;z-index:15;overflow:visible;transition:box-shadow .15s}
.branch:hover{box-shadow:0 0 0 2px rgba(255,255,255,.5)}
.branch.selected{box-shadow:0 0 0 3px #fff,0 0 20px rgba(255,200,60,.6)!important}
.branch.conn-target{box-shadow:0 0 0 3px #4affaa,0 0 20px rgba(74,255,170,.4)!important;cursor:crosshair}
.branch .card-add-btn{top:-8px;right:-8px;width:18px;height:18px;font-size:11px}
.branch-label{position:absolute;top:calc(100% + 4px);left:50%;transform:translateX(-50%);font-size:11px;font-weight:bold;color:#fff;white-space:pre;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.8);pointer-events:none}

/* ── ARROW LABELS ── */
.alabel{position:absolute;transform:translate(-50%,-50%);background:rgba(15,15,40,.88);border:1px solid rgba(255,255,255,.2);padding:4px 10px;border-radius:16px;font-size:12px;color:#e0e0ff;cursor:pointer;white-space:pre;text-align:center;z-index:30;transition:border-color .15s}
.alabel:hover{border-color:rgba(150,100,255,.7);background:rgba(25,15,55,.95)}

/* ── SUBTITLES ── */
.subtitle{position:absolute;background:rgba(0,0,0,.55);border:3px solid #c8a8ff;padding:8px 18px;border-radius:8px;font-size:22px;font-weight:bold;color:#fff;cursor:pointer;z-index:25;white-space:pre;text-shadow:0 2px 6px rgba(0,0,0,.7)}
.subtitle:hover{border-color:#e8c8ff}
.subtitle.selected{outline:3px solid #4af;outline-offset:2px;box-shadow:0 0 18px rgba(74,160,255,.6)}

/* ── IMAGES ── */
.imgel{position:absolute;cursor:pointer;z-index:6}
.imgel img{display:block;border-radius:6px;pointer-events:none}
.imgel:hover{outline:2px solid rgba(255,255,255,.4)}
.imgel.selected{outline:3px solid #4af;outline-offset:2px;box-shadow:0 0 18px rgba(74,160,255,.6)}

/* ── MODAL ── */
#modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:1000}
#modal-overlay.show{display:flex}
.modal{background:#14142e;border:1px solid #2a2a5a;border-radius:14px;padding:22px 24px;width:420px;max-width:95vw;max-height:88vh;overflow-y:auto;position:relative}
.modal h2{margin-bottom:16px;color:#c8a8ff;font-size:15px;font-weight:bold}
.fg{margin-bottom:12px}
.fg label{display:block;font-size:11px;color:#888;margin-bottom:4px}
.fg input[type=text],.fg input[type=number],.fg textarea,.fg select{width:100%;background:#0d0d24;border:1px solid #2a2a5a;color:#e0e0e0;padding:7px 9px;border-radius:6px;font-size:13px;font-family:inherit;outline:none}
.fg input[type=text]:focus,.fg textarea:focus,.fg select:focus{border-color:#6a4aaa}
.fg textarea.ta-line{min-height:36px;height:36px;resize:vertical} /* 1行用textarea（Ctrl+Enterで改行可） */
.fg textarea{resize:vertical;min-height:70px}
.fg input[type=color]{height:34px;padding:2px 4px;cursor:pointer;border-radius:6px;width:60px;background:#0d0d24;border:1px solid #2a2a5a}
.color-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.color-preset{width:26px;height:26px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s}
.color-preset:hover,.color-preset.sel{border-color:#fff}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.btn{padding:7px 16px;border-radius:7px;border:none;cursor:pointer;font-size:13px;font-family:inherit;transition:all .15s}
.btn-p{background:#6a3aaa;color:#fff}.btn-p:hover{background:#8a5acc}
.btn-s{background:#1e1e4a;color:#d0d0ff;border:1px solid #3a3a6a}.btn-s:hover{background:#2a2a6a}
.btn-d{background:#6a1a1a;color:#ffaaaa;border:1px solid #aa3333}.btn-d:hover{background:#8a2020}

/* icon grid */
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:6px}
.icon-opt{background:#0d0d24;border:2px solid transparent;border-radius:6px;padding:6px 2px;text-align:center;cursor:pointer;font-size:18px;transition:border-color .12s}
.icon-opt:hover{border-color:#6a4aaa}
.icon-opt.sel{border-color:#c8a8ff}

/* zone list */
.zone-item{display:flex;align-items:center;gap:8px;background:#0d0d24;padding:8px;border-radius:8px;margin-bottom:7px}
.zone-item input[type=color]{width:38px;height:28px;padding:2px;border-radius:4px;border:1px solid #2a2a5a;cursor:pointer;background:#0d0d24}
.zone-item input[type=text]{flex:1;background:transparent;border:none;border-bottom:1px solid #2a2a5a;color:#e0e0e0;font-size:13px;padding:3px;outline:none;font-family:inherit}
.zone-item .zcheck{width:18px;height:18px;cursor:pointer;accent-color:#c8a8ff;flex-shrink:0}
.zone-del{background:none;border:none;color:#ff6666;cursor:pointer;font-size:16px;padding:0 4px;flex-shrink:0}

/* arrow thickness btns */
.thick-btns{display:flex;gap:6px;margin-top:6px}
.thick-btn{padding:6px 12px;border-radius:6px;border:2px solid #2a2a5a;background:#0d0d24;color:#d0d0ff;cursor:pointer;font-size:12px;transition:all .15s}
.thick-btn.sel{border-color:#c8a8ff;background:#2a1a4a}

/* ── CONTEXT MENU ── */
#ctx-menu{position:fixed;background:#14142e;border:1px solid #2a2a5a;border-radius:10px;padding:5px 0;z-index:2000;min-width:165px;box-shadow:0 6px 30px rgba(0,0,0,.6);display:none}
.ctx-item{padding:8px 16px;cursor:pointer;font-size:13px;color:#d0d0ff;transition:background .12s;display:flex;align-items:center;gap:8px}
.ctx-item:hover{background:#1e1e4a}
.ctx-item.danger{color:#ff8888}
.ctx-item.danger:hover{background:#2a1a1a}
.ctx-sep{height:1px;background:#2a2a5a;margin:4px 0}
.ctx-slider{padding:7px 16px 9px;display:flex;flex-direction:column;gap:5px;cursor:default}
.ctx-slider .ctx-slabel{font-size:11px;color:#9a9ac0;display:flex;justify-content:space-between;gap:10px}
.ctx-slider .ctx-sval{color:#c8b8ff;font-weight:bold}
.ctx-slider input[type=range]{width:100%;accent-color:#9b7aff;cursor:ew-resize;margin:0}

/* ── HINTS ── */
.hint-bar{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:rgba(10,10,40,.9);color:#d0d0ff;padding:9px 22px;border-radius:20px;font-size:13px;display:none;z-index:500;border:1px solid #4a4a8a;pointer-events:none}
.hint-bar.show{display:block}

/* scrollbar */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#0d0d24}
::-webkit-scrollbar-thumb{background:#2a2a5a;border-radius:3px}

/* floating buttons (mobile only) + slide-in drawer pieces */
/* two toggle buttons sit next to each other at the top-left, same style */
#mobile-menu-toggle{display:none;position:fixed;top:8px;left:8px;z-index:520;width:46px;height:46px;border-radius:12px;background:#1a1a3e;border:1px solid #6a6aaa;color:#fff;font-size:22px;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.55);cursor:pointer}
#mobile-sb-toggle{display:none;position:fixed;top:8px;left:62px;z-index:520;width:46px;height:46px;border-radius:12px;background:#2a1e55;border:1px solid #9a6aff;color:#fff;font-size:22px;align-items:center;justify-content:center;box-shadow:0 2px 12px rgba(0,0,0,.55);cursor:pointer}
#menu-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:505}

/* ══ MOBILE (portrait, ≤760px ONLY — desktop unchanged) ══ */
@media (max-width:760px){
  #mobile-menu-toggle{display:flex}
  #mobile-sb-toggle{display:flex}
  body.menu-open #menu-backdrop,body.sb-open #menu-backdrop{display:block}
  /* menubar becomes a left slide-in drawer */
  #menubar{
    position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:300px;height:auto;
    flex-direction:column;align-items:stretch;flex-wrap:nowrap;gap:8px;
    padding:62px 14px 20px;overflow-y:auto;z-index:510;border-bottom:none;border-right:2px solid #2a2a5a;
    transform:translateX(-100%);transition:transform .25s ease;box-shadow:6px 0 26px rgba(0,0,0,.55)}
  body.menu-open #menubar{transform:translateX(0)}
  #menubar .menu-sep{display:none}
  #app-title{font-size:16px;padding:2px 2px 8px;border-bottom:1px solid #2a2a5a;width:100%}
  #menubar .mbtn,#menubar #bg-sel{width:100%;min-height:48px;font-size:15px;text-align:left;padding:10px 14px}
  #doc-title{width:100%;max-width:none;min-height:46px;font-size:18px;background:#1e1e4a;border-color:#5a5a9a} /* prominent, always boxed in the drawer */
  #cloud-status{padding:2px 4px}
  /* sidebar uses the SAME slide-in drawer UI as the menu (same width / style / animation) */
  #sidebar-right{display:none}
  #sidebar{position:fixed;top:0;left:0;bottom:0;width:82vw;max-width:300px;height:auto;z-index:510;
    padding:58px 8px 20px;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;pointer-events:auto;
    background:linear-gradient(180deg,rgba(15,15,36,.97),rgba(11,11,24,.97));
    border-right:2px solid #2a2a5a;box-shadow:6px 0 26px rgba(0,0,0,.55);
    transform:translateX(-100%);transition:transform .25s ease}
  body.sb-open #sidebar{transform:translateX(0)}
  #q-list{pointer-events:auto;padding:8px 7px 24px}
  .q-item{padding:8px 9px;font-size:12.5px;gap:6px;margin-bottom:5px;touch-action:pan-y}
  .q-add-item{min-height:34px;font-size:16px}
  .q-section{font-size:10.5px;padding:8px 9px 3px}
  .clue-item .clue-thumb{width:22px;height:22px;font-size:13px}
  .q-del{opacity:.8}  /* always show delete on touch (no hover) */
  .modal{width:94vw}
  .card-add-btn{width:32px;height:32px;font-size:18px;top:-14px;right:-14px}
  /* bigger default canvas text on mobile for readability (subtitles keep their own size) */
  .alabel{font-size:24px;padding:6px 14px;border-radius:18px}
  .branch-label{font-size:22px}
  .branch{font-size:32px}
}

/* ══ 捜査ボードモード（コルク＋押しピン＋赤い糸） ══ */
#canvas-wrap.bg-board{background-color:#b8874e}
/* 部屋の照明：中央上にスポット光、周辺は暗く落ちるビネット（3D感の要） */
#canvas-wrap.bg-board::before{content:'';position:absolute;inset:0;pointer-events:none;z-index:5;
  background:radial-gradient(ellipse 120% 90% at 50% 30%,rgba(255,238,190,.14) 0%,rgba(255,238,190,0) 40%,rgba(30,12,2,.22) 78%,rgba(24,9,1,.5) 100%)}
/* ボードの縁の落ち影（額縁の内側にいるような奥行き） */
#canvas-wrap.bg-board::after{content:'';position:absolute;inset:0;pointer-events:none;z-index:6;
  box-shadow:inset 0 0 110px rgba(40,16,3,.5),inset 0 0 22px rgba(40,16,3,.4)}
.pushpin{position:absolute;width:18px;height:18px;border-radius:50%;transform:translate(-50%,-58%);z-index:30;pointer-events:none;
  background:radial-gradient(circle at 33% 28%,#ffb3ab 0%,#f4433a 40%,#c62828 62%,#7d1310 100%);
  box-shadow:0 3px 4px rgba(30,10,0,.5),inset -2px -3px 4px rgba(80,0,0,.55),inset 2px 2px 3px rgba(255,190,180,.65)}
.pushpin::before{content:'';position:absolute;left:50%;top:86%;width:16px;height:6px;border-radius:50%;z-index:-1;
  background:radial-gradient(ellipse,rgba(25,8,0,.45),rgba(25,8,0,0) 70%);transform:translate(-38%,0)}
.pushpin::after{content:'';position:absolute;left:50%;top:94%;width:2px;height:5px;background:linear-gradient(#9a9a9a,#3a3a3a);transform:translateX(-50%)}
/* ピン留めされた紙：深い二重影＋わずかな傾き(JSでrotate付与)で立体感 */
#canvas-wrap.bg-board .card{box-shadow:0 10px 18px rgba(30,12,2,.5),0 3px 6px rgba(30,12,2,.38)!important}
#canvas-wrap.bg-board .card.selected{box-shadow:0 14px 24px rgba(30,12,2,.55),0 4px 8px rgba(30,12,2,.4),0 0 0 2px #ffd54f!important}
/* ── 見た目テンプレ（属性から自動適用） ── */
/* 人物 → 顔写真カード（捜査ファイル風：紙色・タイプライター文字・モノクロ写真） */
#canvas-wrap.bg-board .card.attr-person{background:#f6f3ea!important;border:1px solid #b5ad98!important;border-radius:2px!important}
#canvas-wrap.bg-board .card.attr-person .card-name{color:#1c1c1c!important;text-shadow:none!important;font-family:'Courier New',monospace!important;letter-spacing:.04em}
#canvas-wrap.bg-board .card.attr-person .card-sub{color:#5a564a!important;font-family:'Courier New',monospace!important}
#canvas-wrap.bg-board .card.attr-person .card-img{border-radius:0!important;border:1px solid #98917e;filter:grayscale(.85) contrast(1.06) sepia(.12)}
#canvas-wrap.bg-board .card.attr-person .card-icon-wrap{background:#d9d4c4;border:1px solid #a29b88;padding:5px 15px;border-radius:1px}
/* 手がかり・場所 → ポラロイド写真（白い厚縁・下広め・手書き文字） */
#canvas-wrap.bg-board .card.attr-clue,#canvas-wrap.bg-board .card.attr-place{background:#fdfdfb!important;border:1px solid #d8d5cc!important;border-radius:2px!important;padding:12px 12px 7px!important}
#canvas-wrap.bg-board .card.attr-clue .card-img,#canvas-wrap.bg-board .card.attr-place .card-img{border-radius:0!important;border:1px solid #e0ded6;margin-bottom:9px!important}
#canvas-wrap.bg-board .card.attr-clue .card-name,#canvas-wrap.bg-board .card.attr-place .card-name{color:#2a2622!important;text-shadow:none!important;font-family:'UD デジタル 教科書体 N-R','Klee One','Segoe Print',cursive!important}
#canvas-wrap.bg-board .card.attr-clue .card-sub,#canvas-wrap.bg-board .card.attr-place .card-sub{color:#6a655c!important;font-family:'UD デジタル 教科書体 N-R','Klee One','Segoe Print',cursive!important}
#canvas-wrap.bg-board .card.attr-clue .card-icon-wrap,#canvas-wrap.bg-board .card.attr-place .card-icon-wrap{background:#efece2;border:1px solid #ddd8ca;padding:7px 17px;border-radius:1px}
/* 解説 → 付箋（黄色い紙・手書き文字） */
#canvas-wrap.bg-board .desc-box{background:linear-gradient(180deg,#fdef8d,#f6df67)!important;color:#4a3f14!important;border:0!important;border-radius:1px!important;
  box-shadow:0 7px 11px rgba(30,12,2,.35),0 1px 3px rgba(30,12,2,.25)!important;
  font-family:'UD デジタル 教科書体 N-R','Klee One','Segoe Print',cursive!important;transform:rotate(-.8deg)}
/* サブタイトル → 新聞記事（生成り紙・明朝見出し・二重罫線） */
#canvas-wrap.bg-board .subtitle{background:#f2eee2!important;color:#171410!important;border:1px solid #2b2620!important;border-radius:0!important;text-shadow:none!important;
  font-family:Georgia,'Times New Roman','Yu Mincho','MS PMincho',serif!important;
  box-shadow:inset 0 0 0 3px #f2eee2,inset 0 0 0 4px #2b2620,0 9px 15px rgba(30,12,2,.42)!important}

/* ══ GAMECUBE-STYLE BOOT SCREEN ══ */
#boot-screen{position:fixed;inset:0;z-index:99999;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 42%,#2c2458 0%,#161232 50%,#070611 100%);
  perspective:720px;perspective-origin:50% 44%;cursor:pointer;
  animation:bootFade .7s ease 4s forwards}
#boot-screen.skip{animation:bootFade .35s ease forwards}
/* moving reflective floor */
#boot-floor{position:absolute;left:-20%;right:-20%;bottom:0;height:42%;
  background:linear-gradient(180deg,transparent,rgba(120,100,220,.10) 40%,rgba(150,130,255,.16));
  transform:rotateX(72deg);transform-origin:bottom center;
  -webkit-mask-image:radial-gradient(ellipse 60% 100% at 50% 100%,#000,transparent 75%);
          mask-image:radial-gradient(ellipse 60% 100% at 50% 100%,#000,transparent 75%)}
#boot-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(150,130,255,.25) 1px,transparent 1px),linear-gradient(90deg,rgba(150,130,255,.25) 1px,transparent 1px);
  background-size:46px 46px;animation:bootGridMove 2.4s linear 2}
/* the rolling cube */
.boot-roller{position:relative;transform-style:preserve-3d;animation:bootRoll 2.5s cubic-bezier(.42,0,.18,1) forwards;will-change:transform}
.boot-cube{position:relative;width:92px;height:92px;transform-style:preserve-3d;animation:bootSpin 2.5s cubic-bezier(.34,0,.16,1) forwards;filter:drop-shadow(0 12px 26px rgba(120,90,230,.55))}
.bc-face{position:absolute;width:92px;height:92px;border-radius:10px;
  background:linear-gradient(135deg,#8e7ce0 0%,#6450b8 45%,#3f3192 100%);
  border:2px solid rgba(200,185,255,.85);
  box-shadow:inset 0 0 22px rgba(20,10,60,.6),inset 0 0 0 9px rgba(255,255,255,.07)}
/* little inset square that reads like the GC cube's recessed face */
.bc-face::after{content:'';position:absolute;inset:24px;border-radius:5px;
  background:linear-gradient(135deg,rgba(255,255,255,.16),rgba(255,255,255,0));
  box-shadow:inset 0 0 12px rgba(20,10,60,.5)}
.bc-front {transform:translateZ(46px)}
.bc-back  {transform:rotateY(180deg) translateZ(46px)}
.bc-right {transform:rotateY(90deg)  translateZ(46px)}
.bc-left  {transform:rotateY(-90deg) translateZ(46px)}
.bc-top   {transform:rotateX(90deg)  translateZ(46px)}
.bc-bottom{transform:rotateX(-90deg) translateZ(46px)}
/* per-face shading so the cube reads as 3D */
.bc-top   {filter:brightness(1.35)}
.bc-bottom{filter:brightness(.55)}
.bc-left  {filter:brightness(.72)}
.bc-right {filter:brightness(.86)}
.bc-back  {filter:brightness(.7)}
/* logo + tagline */
#boot-logo{position:absolute;left:0;right:0;bottom:16%;text-align:center;opacity:0;animation:bootLogo 1s cubic-bezier(.2,.8,.2,1) 2.35s forwards}
#boot-logo .bl-main{font-size:30px;font-weight:900;letter-spacing:2px;
  background:linear-gradient(90deg,#c8b5ff,#fff,#a98cff);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(160,120,255,.6)}
#boot-logo .bl-sub{margin-top:8px;font-size:12px;letter-spacing:6px;color:#9b8ad6;text-transform:uppercase}
#boot-skip{position:absolute;bottom:26px;font-size:11px;letter-spacing:2px;color:rgba(180,170,230,.5);animation:bootBlink 1.4s ease-in-out 4;animation-delay:1s}
@keyframes bootRoll{
  0%  {transform:translate(-44vw,-180px) }
  12% {transform:translate(-34vw,0)      }
  26% {transform:translate(-24vw,-90px)  }
  40% {transform:translate(-14vw,0)      }
  52% {transform:translate(-7vw,-48px)   }
  64% {transform:translate(0,0)          }
  72% {transform:translate(0,-18px)      }
  80% {transform:translate(0,0) scale(1) }
  100%{transform:translate(0,-6px) scale(1.35)}
}
@keyframes bootSpin{
  0%  {transform:rotateX(-30deg) rotateY(0)       rotateZ(0)}
  64% {transform:rotateX(380deg) rotateY(330deg)  rotateZ(0)}
  100%{transform:rotateX(388deg) rotateY(405deg)  rotateZ(0)}
}
@keyframes bootGridMove{from{background-position:0 0}to{background-position:0 46px}}
@keyframes bootLogo{0%{opacity:0;transform:translateY(18px) scale(.92)}100%{opacity:1;transform:translateY(0) scale(1)}}
@keyframes bootFade{to{opacity:0;visibility:hidden;pointer-events:none}}
@keyframes bootBlink{0%,100%{opacity:.25}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){
  #boot-screen{animation:bootFade .4s ease .6s forwards}
  .boot-roller,.boot-cube,#boot-grid{animation:none}
  #boot-logo{animation:bootLogo .4s ease .1s forwards}
}

/* ════════════════════════════════════════════════════════════════════
   ▼▼▼ WINDOWS 2000 / CLASSIC SKIN  （レトロ外装・追記のみの上書き）▼▼▼
   この区切りからブロック末尾までを丸ごと win2k.css に切り出せば他アプリへ流用可。
   方針: メニュー/ボタン/サイドバー/ダイアログ/入力欄/スクロールバー＝クラシック化。
         キャンバスのカード色（人物=青/手がかり=橙 等）は機能色なので保持。
   ════════════════════════════════════════════════════════════════════ */
:root{
  --w2k-face:#c0c0c0; --w2k-light:#dfdfdf; --w2k-shadow:#808080;
  --w2k-title1:#000080; --w2k-title2:#1084d0; --w2k-sel:#000080;
  --w2k-desktop:#008080; --w2k-tip:#ffffe1;
  --w2k-font:'Tahoma','MS Sans Serif','MS UI Gothic','MS PGothic','Hiragino Kaku Gothic Pro',sans-serif;
  /* 3D ベベル群（98.css 方式）*/
  --w2k-raise:inset -1px -1px #000,inset 1px 1px #fff,inset -2px -2px #808080,inset 2px 2px #dfdfdf;
  --w2k-press:inset -1px -1px #fff,inset 1px 1px #000,inset -2px -2px #dfdfdf,inset 2px 2px #808080;
  --w2k-field:inset -1px -1px #fff,inset 1px 1px #808080,inset -2px -2px #dfdfdf,inset 2px 2px #000;
  --w2k-win:inset -1px -1px #000,inset 1px 1px #dfdfdf,inset -2px -2px #808080,inset 2px 2px #fff;
}
/* ── 基本 ── */
body{font-family:var(--w2k-font)!important;background:var(--w2k-desktop)!important;color:#000!important;font-size:11px!important}
::selection{background:var(--w2k-sel);color:#fff}
input[type=checkbox],input[type=range]{accent-color:var(--w2k-sel)!important}
/* ── デスクトップ(キャンバス) ── */
#canvas-wrap{background-color:var(--w2k-desktop)!important}  /* ショートハンド禁止: .bg-grid/.bg-dots の background-image を潰さないため */
.bg-grid{background-image:linear-gradient(rgba(0,0,0,.13) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.13) 1px,transparent 1px)!important}
.bg-dots{background-image:radial-gradient(circle,rgba(0,0,0,.18) 1.4px,transparent 1.4px)!important}
/* ── メニューバー＝クラシックなツールバー ── */
#menubar{background:var(--w2k-face)!important;border:0!important;border-bottom:1px solid var(--w2k-shadow)!important;box-shadow:inset 0 1px #fff,inset 0 -1px var(--w2k-light)!important;padding:3px 5px!important;gap:3px!important}
#app-title{color:#000!important;text-shadow:none!important;font-weight:bold!important}
/* ドキュメントタイトル＝白い沈み込みフィールド */
#doc-title,#doc-title:placeholder-shown,#doc-title:hover:not(:focus),#doc-title:focus{background:#fff!important;color:#000!important;border:0!important;border-radius:0!important;box-shadow:var(--w2k-field)!important;text-shadow:none!important;font-weight:bold!important;padding:3px 6px!important}
#doc-title::placeholder{color:var(--w2k-shadow)!important}
/* ── ボタン（ツールバー＆ダイアログ） ── */
.mbtn,.btn,.thick-btn{background:var(--w2k-face)!important;color:#000!important;border:0!important;border-radius:0!important;box-shadow:var(--w2k-raise)!important;font-family:var(--w2k-font)!important;font-size:11px!important;padding:4px 11px!important;text-shadow:none!important}
.mbtn:hover,.btn:hover,.thick-btn:hover{background:var(--w2k-face)!important;color:#000!important}
.mbtn:active,.btn:active,.thick-btn:active,.mbtn.active,.thick-btn.sel{box-shadow:var(--w2k-press)!important;background:var(--w2k-face)!important;color:#000!important}
.mbtn:disabled,.mbtn:disabled:hover{background:var(--w2k-face)!important;color:var(--w2k-shadow)!important;text-shadow:1px 1px #fff!important;box-shadow:var(--w2k-raise)!important;opacity:1!important}
.mbtn.save-grp,.mbtn.save-grp:hover{background:var(--w2k-face)!important;border:0!important}
.mbtn.danger:hover{background:var(--w2k-face)!important;color:#000!important}
#btn-login.in{background:var(--w2k-face)!important}
.btn-p{box-shadow:var(--w2k-raise),0 0 0 1px #000!important}  /* 既定ボタンは黒枠を一周追加 */
/* ── ドロップダウン ── */
#bg-sel,.fg select{background:#fff!important;color:#000!important;border:0!important;border-radius:0!important;box-shadow:var(--w2k-field)!important;padding:2px 4px!important;font-size:11px!important}
/* ── 区切り線（彫り込み） ── */
.menu-sep,.menu-sep.menu-push{width:2px!important;height:20px!important;background:transparent!important;border-left:1px solid var(--w2k-shadow)!important;border-right:1px solid #fff!important;box-shadow:none!important;margin:0 4px!important}
/* ── サイドバー＝白いリストボックス＋紺色タイトルバー ── */
#q-list,#q-list-right{background:#fff!important;border-radius:0!important;box-shadow:var(--w2k-field)!important;margin:5px!important;padding:2px!important;flex:0 1 auto!important}
.q-item{background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:#000!important;margin:0!important;padding:2px 6px!important;font-size:11px!important}
.q-item:hover{background:#cfd6ff!important;color:#000!important}
.q-item.active,.q-item.active *{background:var(--w2k-sel)!important;color:#fff!important}
.q-item.q-add-item,.q-item.q-add-item:hover{background:var(--w2k-face)!important;border:0!important;box-shadow:var(--w2k-raise)!important;color:#000!important;margin:3px 2px!important}
.q-section,.q-section:hover{background:linear-gradient(90deg,var(--w2k-title1),var(--w2k-title2))!important;color:#fff!important;padding:2px 6px!important;margin:5px 0 2px!important;letter-spacing:0!important;font-size:11px!important}
.q-section.off{color:#d8d8d8!important}
.clue-item .clue-thumb{border-radius:0!important;box-shadow:var(--w2k-field)!important}
/* ── ☰ スライドインのファイルパネル ── */
#file-menu{background:var(--w2k-face)!important;border:0!important;box-shadow:var(--w2k-win)!important}
#file-menu .fm-title{color:#000!important;border-bottom:1px solid var(--w2k-shadow)!important}
#file-menu #cloud-status,#cloud-status{color:#000!important}
/* ── ダイアログ（モーダル） ── */
#modal-overlay{background:rgba(0,0,0,.25)!important}
.modal{background:var(--w2k-face)!important;color:#000!important;border:1px solid #000!important;border-radius:0!important;box-shadow:var(--w2k-win),3px 3px 0 rgba(0,0,0,.35)!important;padding:14px!important}
.modal h2{margin:-14px -14px 14px!important;padding:3px 7px!important;background:linear-gradient(90deg,var(--w2k-title1),var(--w2k-title2))!important;color:#fff!important;font-size:12px!important;font-weight:bold!important}
.modal,.modal .fg,.modal p,.modal small,.modal li,.modal b,.modal .sub,.modal .hint{color:#000!important}
.fg label{color:#000!important}
.fg input[type=text],.fg input[type=number],.fg textarea,.fg select,.zone-item input[type=text]{background:#fff!important;color:#000!important;border:0!important;border-radius:0!important;box-shadow:var(--w2k-field)!important;font-size:11px!important;padding:3px 4px!important}
.fg input:focus,.fg textarea:focus,.fg select:focus{border:0!important;box-shadow:var(--w2k-field)!important;outline:1px dotted #000;outline-offset:-3px}
/* アイコングリッド / ゾーン */
.icon-opt{background:#fff!important;border:0!important;border-radius:0!important;box-shadow:var(--w2k-field)!important}
.icon-opt.sel{outline:2px solid var(--w2k-sel);outline-offset:-2px}
.zone-item{background:var(--w2k-face)!important;border-radius:0!important;box-shadow:var(--w2k-raise)!important}
/* ── 右クリックメニュー ── */
#ctx-menu{background:var(--w2k-face)!important;border:1px solid #000!important;border-radius:0!important;box-shadow:var(--w2k-win),2px 2px 0 rgba(0,0,0,.3)!important;padding:2px!important}
.ctx-item{color:#000!important;font-size:11px!important;padding:4px 18px!important}
.ctx-item:hover,.ctx-item.danger:hover{background:var(--w2k-sel)!important;color:#fff!important}
.ctx-item.danger{color:#000!important}
.ctx-sep{background:transparent!important;border-top:1px solid var(--w2k-shadow);border-bottom:1px solid #fff;height:0!important;margin:3px 1px!important}
.ctx-slider .ctx-slabel,.ctx-slider .ctx-sval{color:#000!important}
/* ── ヒント＝クラシックなツールチップ ── */
.hint-bar{background:var(--w2k-tip)!important;color:#000!important;border:1px solid #000!important;border-radius:0!important;box-shadow:none!important}
/* ── スクロールバー ── */
::-webkit-scrollbar{width:16px!important;height:16px!important}
::-webkit-scrollbar-track{background:var(--w2k-face)!important;box-shadow:var(--w2k-field)}
::-webkit-scrollbar-thumb{background:var(--w2k-face)!important;border-radius:0!important;box-shadow:var(--w2k-raise)}
::-webkit-scrollbar-button{display:block;height:16px;width:16px;background:var(--w2k-face);box-shadow:var(--w2k-raise)}
::-webkit-scrollbar-corner{background:var(--w2k-face)}
/* モバイルの浮動トグル */
#mobile-menu-toggle,#mobile-sb-toggle{background:var(--w2k-face)!important;color:#000!important;border:0!important;border-radius:0!important;box-shadow:var(--w2k-raise)!important}
/* ── キャンバス上の要素：色は保持し、角をスクエア＋クラシックなベベルに ── */
.card{border:1px solid #000!important;box-shadow:var(--w2k-raise)!important}
.card:not(.shape-circle){border-radius:0!important}
.card:hover{box-shadow:var(--w2k-raise),0 0 0 1px #000!important}
.card.selected{box-shadow:var(--w2k-press)!important;outline:1px dotted #fff;outline-offset:-4px}
.card.conn-target{outline:2px dotted #fff!important;outline-offset:2px}
.branch{box-shadow:var(--w2k-raise)!important}
.subtitle{background:var(--w2k-face)!important;color:#000!important;border:0!important;border-radius:0!important;box-shadow:var(--w2k-raise)!important;text-shadow:none!important}

<script>
'use strict';

// ═══════════════════════════════════════
//  STATE
// ═══════════════════════════════════════
const S = {
  bg:'grid', zoom:1, panX:60, panY:60,
  showDesc:true, mode:'normal',
  connecting:null,   // {fromId}
  dragging:null,     // {type,id,sx,sy,ox,oy,moved}
  panning:false, panSt:null,
  mouse:{x:0,y:0},   // canvas coords
  selection:[],      // ids of multi-selected elements (Ctrl+Click)
  // multi-board: each "疑問" (question) is its own diagram. 'main' is the root board.
  currentBoard:'main', questions:[], boards:{}, cardOrder:[], docTitle:'', cardFilter:'all',
  chapters:['1章'], chapter:'1章',  // 章（チャプター）モード。'__all'=全章表示
  boardMode:false,   // 捜査ボードモード（コルク＋押しピン＋揺れる糸）
  clues:[], showMain:true, showQuestions:true, showClues:true, // 手がかり palette + sidebar toggles
  showCards:true, showLayers:true,                              // right-sidebar section toggles
  layers:[],            // 時系列レイヤー = それぞれ独立した図(キャンバス)の一覧(global)。各 id は S.boards のボード id。レイヤー1の id='main'
  cards:[], arrows:[], branches:[], zones:[], subtitles:[], images:[]
};
const LAYER_COLORS=['#ff6b6b','#4dabf7','#51cf66','#ffd43b','#cc5de8','#ff922b','#20c997','#f06595'];
// カードの属性（人物/手がかり/場所/疑問・伏線）。色は属性で自動的に決まる。
const ATTRS={
  person:  {label:'人物',     color:'#4dabf7', icon:'👤', defName:'新しい人物'},
  clue:    {label:'手がかり', color:'#ffa94d', icon:'🔍', defName:'新しい手がかり'},
  place:   {label:'場所',     color:'#51cf66', icon:'📍', defName:'新しい場所'},
  question:{label:'疑問・伏線',color:'#cc5de8', icon:'❓'}
};
function attrOf(c){return (c&&c.attr)|| (c&&c.linkBoard?'question': (c&&c.fromClue?'clue':'person'));}
const FUKUSEN='伏線'; // 特別な章タグ：付いたカードは章に関係なくサイドバー最下部の伏線欄に常時表示
// 章ヘルパー
function curChapterForNew(){ return S.chapter==='__all' ? '' : S.chapter; } // 新規作成時に付ける章（全章表示なら無タグ）
function tagChapter(card){ const ch=curChapterForNew(); if(!ch)return; card.chapters=card.chapters||[]; if(!card.chapters.includes(ch))card.chapters.push(ch); }
function cardChapters(c){ return (c&&c.chapters)||[]; }
function inChapter(c){ const ch=S.chapter; if(ch==='__all')return true; const cs=cardChapters(c); return cs.length===0 || cs.includes(ch); } // 無タグは全章で表示
function isFukusen(c){ return cardChapters(c).includes(FUKUSEN); }
function layerInChapter(l){ const ch=S.chapter; if(ch==='__all'||!l.chapter)return true; return l.chapter===ch; }
function setChapter(ch){
  S.chapter=ch;
  document.getElementById('btn-chapter').textContent='📖 '+(ch==='__all'?'全章':ch)+' ▾';
  // 章を切り替えたとき、現在のレイヤーがその章に属さなければ、その章の最初のレイヤーへ移動
  if(ch!=='__all'){
    const cur=layerById(S.currentBoard);
    if(cur && cur.chapter && cur.chapter!==ch){
      const tgt=S.layers.find(l=>l.chapter===ch&&isMainLayer(l))||S.layers.find(l=>l.chapter===ch)||S.layers.find(l=>!l.chapter);
      if(tgt && tgt.id!==S.currentBoard){ switchBoard(tgt.id); }
    }
  }
  renderSidebar(); scheduleCommit();
}
function openChapterMenu(ev){
  const items=[];
  items.push({icon:'📚',label:'全章を表示',action:()=>setChapter('__all')});
  S.chapters.forEach(ch=>items.push({icon:(S.chapter===ch?'✔':'　'),label:ch,action:()=>setChapter(ch)}));
  items.push('sep');
  items.push({icon:'＋',label:'章を追加',action:promptAddChapter});
  if(S.chapter!=='__all')items.push({icon:'✏️',label:'この章の名前を変更',action:()=>renameChapter(S.chapter)});
  if(S.chapter!=='__all'&&S.chapters.length>1)items.push({icon:'🗑',label:'この章を削除',danger:true,action:()=>deleteChapter(S.chapter)});
  const r=ev.currentTarget.getBoundingClientRect();
  showCtx(r.left, r.bottom+4, items);
}
// 章を追加：名称を入力してから追加（既定は「N章」）
function promptAddChapter(){
  const def=(S.chapters.length+1)+'章';
  showModal(`<h2>章を追加</h2>
    <div class="fg"><label>章の名前</label><input type="text" id="ch-name" value="${esc(def)}" placeholder="例: 2章 / 第二幕"></div>
    <div class="mact"><button class="btn btn-s" onclick="hideModal()">キャンセル</button><button class="btn btn-p" id="ch-ok">追加</button></div>`,()=>{
    const inp=document.getElementById('ch-name');inp.focus();inp.select();
    const ok=()=>{
      const nm=(inp.value||'').trim();
      if(!nm){inp.focus();return;}                 // 空名は追加しない
      if(!S.chapters.includes(nm))S.chapters.push(nm); // 既存と同名ならその章へ切替するだけ
      hideModal();
      setChapter(nm);
    };
    document.getElementById('ch-ok').onclick=ok;
    inp.onkeydown=e=>{if(e.key==='Enter')ok();};
  });
}
function renameChapter(old){
  showModal(`<h2>章の名前 <span style="font-size:11px;color:#9a9ad0;font-weight:400">（自動保存）</span></h2><div class="fg"><input type="text" id="ch-name" value="${esc(old)}"></div><div class="mact"><button class="btn btn-p" onclick="hideModal()">閉じる</button></div>`,()=>{
    const inp=document.getElementById('ch-name');inp.focus();inp.select();
    inp.addEventListener('input',()=>{ const nv=(inp.value||'').trim(); if(!nv||nv===old||S.chapters.includes(nv))return;
      // 章名を全カード/レイヤーに反映
      S.chapters=S.chapters.map(c=>c===old?nv:c);
      Object.values(S.boards).forEach(bd=>(bd.cards||[]).forEach(c=>{ if(c.chapters)c.chapters=c.chapters.map(x=>x===old?nv:x); }));
      S.clues.forEach(c=>{ if(c.chapters)c.chapters=c.chapters.map(x=>x===old?nv:x); });
      S.layers.forEach(l=>{ if(l.chapter===old)l.chapter=nv; });
      if(S.chapter===old)S.chapter=nv;
      old=nv; setChapter(nv);
    });
    inp.onkeydown=e=>{if(e.key==='Enter')hideModal();};
  });
}
function deleteChapter(ch){
  if(S.chapters.length<=1)return;
  if(!confirm('章「'+ch+'」を削除しますか？（カードやレイヤーは残り、この章タグだけ外れます）'))return;
  S.chapters=S.chapters.filter(c=>c!==ch);
  Object.values(S.boards).forEach(bd=>(bd.cards||[]).forEach(c=>{ if(c.chapters)c.chapters=c.chapters.filter(x=>x!==ch); }));
  S.clues.forEach(c=>{ if(c.chapters)c.chapters=c.chapters.filter(x=>x!==ch); });
  S.layers.forEach(l=>{ if(l.chapter===ch)l.chapter=null; });
  hideModal(); setChapter(S.chapters[0]);
}

let _uid=0;
const uid=()=>'n'+(++_uid)+'_'+Math.random().toString(36).slice(2,5);

const PRESETS=['#e74c8b','#9b59b6','#3498db','#1abc9c','#27ae60','#f1c40f','#e67e22','#e74c3c','#607d8b','#ffffff'];
const ICONS=['✦','☽','✸','★','♥','♦','⚡','♟','⚔','👑','💎','🔥','🌸','⚙️','?','!','◆','▲'];

// ═══════════════════════════════════════
//  DOM REFS
// ═══════════════════════════════════════
const wrap   = document.getElementById('canvas-wrap');
const inner  = document.getElementById('canvas-inner');
const svgL   = document.getElementById('svg-layer');
const zonesG = document.getElementById('zones-g');
const descLinesG = document.getElementById('desc-lines-g');
const arrsG  = document.getElementById('arrows-g');
const tempArr= document.getElementById('temp-arrow');
const elems  = document.getElementById('elems');
const modOv  = document.getElementById('modal-overlay');
const modBox = document.getElementById('modal-box');
const ctxMenu= document.getElementById('ctx-menu');
const hintConn  = document.getElementById('hint-conn');
const hintBranch= document.getElementById('hint-branch');

// ═══════════════════════════════════════
//  UNDO / REDO HISTORY
// ═══════════════════════════════════════
let history=[], histIdx=-1, _commitTimer=null, _suppressCommit=false, _dirty=false, _loadingDoc=false;
const HIST_MAX=60;
function docState(){
  // GLOBAL snapshot of the whole document (every board/layer/疑問) so undo works across board switches
  saveActiveBoard(); // fold the live canvas back into S.boards first
  return JSON.stringify({boards:S.boards,layers:S.layers,questions:S.questions,clues:S.clues,bg:S.bg,showDesc:S.showDesc});
}
function scheduleCommit(){
  if(_suppressCommit||_loadingDoc)return;
  _dirty=true;updateUndoUI();          // a change exists → undo becomes available immediately
  clearTimeout(_commitTimer);
  _commitTimer=setTimeout(commitNow,300); // coalesce rapid changes (slider drags etc.)
  cloudSaveDebounced();                // sync to cloud when signed in
  autosaveLocalDebounced();            // always keep a local autosave (works without login)
}
// ── Auto-save to this browser (localStorage). Restores on next visit even without login. ──
const LOCAL_KEY='clueboard_doc_v1';
let _localTimer=null;
function autosaveLocalNow(){
  if(_loadingDoc)return;
  try{
    localStorage.setItem(LOCAL_KEY, JSON.stringify(currentDocData()));
    if(!fbUser)setCloudStatus('💾 自動保存済み'); // when not using cloud, reassure the user locally
  }catch(e){ console.warn('local autosave failed',e); }
}
function autosaveLocalDebounced(){
  if(_loadingDoc)return;
  clearTimeout(_localTimer); _localTimer=setTimeout(autosaveLocalNow,500);
}
function tryRestoreLocal(){
  try{
    const raw=localStorage.getItem(LOCAL_KEY);
    if(!raw)return false;
    applyDocData(JSON.parse(raw));   // applyDocData renders + resets history
    return true;
  }catch(e){ console.warn('local restore failed',e); return false; }
}
function commitNow(){
  clearTimeout(_commitTimer);
  if(_suppressCommit)return;
  const content=docState();
  _dirty=false;
  if(histIdx>=0&&history[histIdx].content===content){updateUndoUI();return;} // no content change (e.g. just switched layer/疑問)
  history=history.slice(0,histIdx+1);
  history.push({content,board:S.currentBoard}); // remember which board this edit was made on
  if(history.length>HIST_MAX)history.shift();
  histIdx=history.length-1;
  updateUndoUI();
}
// Restore a whole-document snapshot, viewing `viewBoard` (the board where that edit happened)
function applyState(content, viewBoard){
  const d=JSON.parse(content);
  S.boards=d.boards||{}; S.layers=d.layers||S.layers; S.questions=d.questions||S.questions;
  S.clues=d.clues||S.clues; S.bg=d.bg; S.showDesc=d.showDesc;
  S.currentBoard = (viewBoard&&S.boards[viewBoard]) ? viewBoard
                 : (S.boards[S.currentBoard]?S.currentBoard:(S.layers[0]?S.layers[0].id:'main'));
  loadActiveBoard();
  _dirty=false;_suppressCommit=true;
  render();applyTf();renderSidebar();
  const bgSel=document.getElementById('bg-sel');if(bgSel)bgSel.value=S.bg;
  const db=document.getElementById('btn-toggle-desc');if(db)db.classList.toggle('active',S.showDesc);
  _suppressCommit=false;
  autosaveLocalDebounced();cloudSaveDebounced(); // persist undo/redo results too
}
function undo(){
  commitNow();          // flush any pending change first
  if(histIdx<=0)return;
  const editBoard=history[histIdx].board; // go back to the layer/疑問 where the undone action happened
  histIdx--;applyState(history[histIdx].content, editBoard);updateUndoUI();
}
function redo(){
  if(histIdx>=history.length-1)return;
  histIdx++;applyState(history[histIdx].content, history[histIdx].board);updateUndoUI();
}
function resetHistory(){history=[];histIdx=-1;_dirty=false;commitNow();}
function updateUndoUI(){
  const u=document.getElementById('btn-undo'),r=document.getElementById('btn-redo');
  if(u)u.disabled=histIdx<=0&&!_dirty;
  if(r)r.disabled=_dirty||histIdx>=history.length-1;
}

// ═══════════════════════════════════════
//  MULTI-SELECT (Ctrl+Click) & ALIGN / DISTRIBUTE
// ═══════════════════════════════════════
function selById(id){return cardById(id)||branchById(id)||S.subtitles.find(s=>s.id===id)||S.images.find(i=>i.id===id);}
function isSelected(id){return S.selection.includes(id);}
function toggleSelect(id){
  const i=S.selection.indexOf(id);
  if(i>=0)S.selection.splice(i,1); else S.selection.push(id);
  applySelectionClasses();
}
function clearSelection(){ if(!S.selection.length)return; S.selection=[]; applySelectionClasses(); }
function applySelectionClasses(){
  S.selection=S.selection.filter(id=>!!selById(id)); // drop deleted
  elems.querySelectorAll('.card,.branch,.subtitle,.imgel').forEach(el=>{
    el.classList.toggle('selected', S.selection.includes(el.dataset.id));
  });
  updateAlignUI();
}
function updateAlignUI(){
  const b=document.getElementById('btn-align');
  if(b)b.disabled=S.selection.length<2;
}
// bounding box of a selectable element {node,w,h}; node.x/node.y is the top-left
function elemBox(id){
  const c=cardById(id); if(c)return{node:c,w:cardEffW(c),h:cardEffH(c)};
  const b=branchById(id); if(b)return{node:b,w:40,h:40};
  const s=S.subtitles.find(x=>x.id===id);
  if(s){const el=elems.querySelector(`.subtitle[data-id="${id}"]`);return{node:s,w:el?el.offsetWidth:140,h:el?el.offsetHeight:44};}
  const im=S.images.find(x=>x.id===id); if(im)return{node:im,w:im.w,h:im.h};
  return null;
}
function alignSel(mode){
  hideCtx();
  const boxes=S.selection.map(elemBox).filter(Boolean);
  if(boxes.length<2)return;
  let minX=Infinity,minY=Infinity,maxR=-Infinity,maxB=-Infinity;
  boxes.forEach(b=>{const n=b.node;minX=Math.min(minX,n.x);minY=Math.min(minY,n.y);maxR=Math.max(maxR,n.x+b.w);maxB=Math.max(maxB,n.y+b.h);});
  const cx=(minX+maxR)/2, cy=(minY+maxB)/2;
  if(mode==='left')       boxes.forEach(b=>b.node.x=minX);
  else if(mode==='right') boxes.forEach(b=>b.node.x=maxR-b.w);
  else if(mode==='centerH')boxes.forEach(b=>b.node.x=cx-b.w/2);
  else if(mode==='top')   boxes.forEach(b=>b.node.y=minY);
  else if(mode==='bottom')boxes.forEach(b=>b.node.y=maxB-b.h);
  else if(mode==='middleV')boxes.forEach(b=>b.node.y=cy-b.h/2);
  else if(mode==='distH'){
    const s=[...boxes].sort((a,b)=>a.node.x-b.node.x);
    const gap=(maxR-minX-s.reduce((t,b)=>t+b.w,0))/(s.length-1);
    let cur=minX; s.forEach(b=>{b.node.x=cur;cur+=b.w+gap;});
  }
  else if(mode==='distV'){
    const s=[...boxes].sort((a,b)=>a.node.y-b.node.y);
    const gap=(maxB-minY-s.reduce((t,b)=>t+b.h,0))/(s.length-1);
    let cur=minY; s.forEach(b=>{b.node.y=cur;cur+=b.h+gap;});
  }
  boxes.forEach(b=>{b.node.x=clampW(b.node.x);b.node.y=clampW(b.node.y);});
  render();
}
function openAlignMenu(x,y){
  if(S.selection.length<2)return;
  showCtx(x,y,[

    else { obj.key=!obj.key; render(); scheduleCommit(); }

// a card's key is a property of the entity, so mirror it to every same-named card on every layer/board
function setCardKey(card, value){
  card.key=value;
  const nm=(card.name||'').trim();
  if(nm){
    saveActiveBoard();
    Object.values(S.boards).forEach(bd=>(bd.cards||[]).forEach(c=>{ if((c.name||'').trim()===nm)c.key=value; }));
    S.clues.forEach(cl=>{ if((cl.name||'').trim()===nm)cl.key=value; }); // keep the matching 手がかり (palette) in sync
  }
  render();renderSidebar();scheduleCommit();
}
// gather key cards across all layers AND 疑問 boards, unique by name, recording which boards each appears on
function collectKeyCards(){
  saveActiveBoard();
  const map=new Map();
  const clueNames=new Set(S.clues.map(c=>(c.name||'').trim()).filter(Boolean)); // 手がかりは疑問・伏線バーに出さない
  const boardIds=S.layers.map(l=>l.id).concat(S.questions.map(q=>q.id)); // layers + 疑問 diagrams
  boardIds.forEach(bid=>{ const bd=S.boards[bid]; if(!bd||!bd.cards)return;
    bd.cards.forEach(c=>{ if(!c.key)return; if(c.fromClue||clueNames.has((c.name||'').trim()))return; // skip 手がかり-derived keys
      const k=(c.name||'').trim()||(' '+c.id);
      if(!map.has(k))map.set(k,{name:c.name||'(無名)',boards:[]});
      if(!map.get(k).boards.includes(bid))map.get(k).boards.push(bid); });
  });
  return [...map.values()];
}

function saveActiveBoard(){ S.boards[S.currentBoard]=boardData(); }
function loadActiveBoard(){

const BLANK_BOARD=()=>({cards:[],arrows:[],branches:[],zones:[],subtitles:[],images:[],panX:60,panY:60,zoom:1});
function ensureLayers(mainName){

function layerById(id){return S.layers.find(l=>l.id===id);}

function deleteLayer(id){

// ── 右下リサイズハンドル（カード/分岐/テキスト/画像/解説 共通） ──
function ensureRsz(el,onStart){
  if(el.querySelector(':scope > .rsz'))return;
  const h=document.createElement('div');h.className='rsz';h.title='ドラッグでサイズ変更';
  h.addEventListener('mousedown',e=>{ if(e.button!==0)return; e.stopPropagation(); e.preventDefault(); onStart(e); });
  h.addEventListener('touchstart',e=>{ if(e.touches.length!==1)return; e.stopPropagation(); e.preventDefault(); onStart(e); },{passive:false});
  el.appendChild(h);
}
function rszDrag(e,s0,apply){
  const p0=e.touches?e.touches[0]:e;
  const sx=p0.clientX, sy=p0.clientY;
  const mv=ev=>{ const p=ev.touches?ev.touches[0]:ev; if(!p)return; if(ev.cancelable)ev.preventDefault();
    const d=Math.max((p.clientX-sx)/S.zoom,(p.clientY-sy)/S.zoom); apply(s0,d); };
  const up=()=>{ window.removeEventListener('mousemove',mv);window.removeEventListener('mouseup',up);
    window.removeEventListener('touchmove',mv);window.removeEventListener('touchend',up); scheduleCommit(); };
  window.addEventListener('mousemove',mv); window.addEventListener('mouseup',up);
  window.addEventListener('touchmove',mv,{passive:false}); window.addEventListener('touchend',up);
}
// 配置されたレイヤーのタグを解説に自動挿入（既にあれば何もしない）
function autoLayerTag(card){
  const ly=layerById(S.currentBoard); if(!ly||!card)return;

  card.desc=((card.desc||'').trim()? card.desc+' ':'')+tag;
}
// 解説・章タグは「同じカード（同名）」で全レイヤー・全疑問ボード＋手がかりパレットに共有される
function syncCardByName(card){
  const nm=(card.name||'').trim(); if(!nm)return;
  saveActiveBoard();
  const chs=(card.chapters||[]).slice();
  Object.values(S.boards).forEach(bd=>(bd.cards||[]).forEach(c=>{ if(c!==card&&(c.name||'').trim()===nm){c.desc=card.desc;c.chapters=chs.slice();} }));
  S.clues.forEach(cl=>{ if((cl.name||'').trim()===nm){cl.desc=card.desc;cl.chapters=chs.slice();} });
}
// 同名カードを全ボード横断で改名（カードの同一性は名前で繋がっているため）
function renameCardEverywhere(oldName,newName){
  const o=(oldName||'').trim(), n=(newName||'').trim();
  if(!o||o===n)return;
  saveActiveBoard();
  Object.values(S.boards).forEach(bd=>(bd.cards||[]).forEach(c=>{ if((c.name||'').trim()===o)c.name=newName; }));
  S.clues.forEach(cl=>{ if((cl.name||'').trim()===o)cl.name=newName; });
}
function switchBoard(id){
  if(id===S.currentBoard)return;
  if(id!=='main'&&!S.boards[id])return;
  commitNow();          // flush any pending edit on the current board into history before leaving
  saveActiveBoard();
  S.currentBoard=id;
  loadActiveBoard();
  render();applyTf();renderSidebar();  // history is GLOBAL now — do NOT reset on switch, so 戻る can return to the previous layer
}
function addQuestion(){

// boards where this 疑問's link-node card has been placed (so we can offer "go to the card")

function makeBoardItem(en){

  it.appendChild(ico);it.appendChild(ti);
  if(en.isQ)it.style.borderLeft='4px solid '+ATTRS.question.color; // 疑問・伏線属性色
  if(en.isQ){

    it.appendChild(del);

    it.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();renameQuestion(en.id);}; // right-click → edit title
    // drag & drop to reorder questions
    it.classList.add('q-drag-h');

    it.addEventListener('dragend',()=>{it.classList.remove('q-dragging');clearDropMarks();_dragQId=null;});
    it.addEventListener('dragover',ev=>{
      if(!_dragQId||_dragQId===en.id)return;

      clearDropMarks();it.classList.add(after?'q-over-bottom':'q-over-top');
    });
    it.addEventListener('drop',ev=>{
      ev.preventDefault();
      if(!_dragQId||_dragQId===en.id)return;
      const r=it.getBoundingClientRect();const after=ev.clientY>r.top+r.height/2;
      moveQuestion(_dragQId,en.id,after);
    });
  }
  it.onclick=()=> en.isQ ? chooseQuestionAction(en.id,en.title) : switchBoard(en.id);
  return it;
}
let _dragQId=null;
function clearDropMarks(){
  document.querySelectorAll('.q-over-top,.q-over-bottom').forEach(el=>el.classList.remove('q-over-top','q-over-bottom'));
}
// generic drag-to-reorder for any sidebar list item (type isolates each list; moveFn(dragId,targetId,after) reorders)
let _reorder=null;
function wireReorder(it, type, id, moveFn){
  it.classList.add('q-drag-h'); it.draggable=true;
  it.addEventListener('dragstart',e=>{ _reorder={type,id}; try{e.dataTransfer.effectAllowed='copyMove';}catch(_){ } it.classList.add('q-dragging'); });
  it.addEventListener('dragend',()=>{ it.classList.remove('q-dragging'); clearDropMarks(); _reorder=null; });
  it.addEventListener('dragover',e=>{ if(!_reorder||_reorder.type!==type||_reorder.id===id)return; e.preventDefault(); try{e.dataTransfer.dropEffect='move';}catch(_){ } const r=it.getBoundingClientRect(); const after=e.clientY>r.top+r.height/2; clearDropMarks(); it.classList.add(after?'q-over-bottom':'q-over-top'); });
  it.addEventListener('drop',e=>{ if(!_reorder||_reorder.type!==type||_reorder.id===id)return; e.preventDefault(); e.stopPropagation(); const r=it.getBoundingClientRect(); const after=e.clientY>r.top+r.height/2; const dragId=_reorder.id; _reorder=null; moveFn(dragId,id,after); });
}
function moveLayer(fromId,targetId,after){
  const from=S.layers.findIndex(l=>l.id===fromId);if(from<0)return;
  const [item]=S.layers.splice(from,1);
  let ti=S.layers.findIndex(l=>l.id===targetId);
  if(ti<0)S.layers.push(item); else S.layers.splice(after?ti+1:ti,0,item);
  renderSidebar();scheduleCommit();
}
function moveClue(fromId,targetId,after){
  const from=S.clues.findIndex(c=>c.id===fromId);if(from<0)return;
  const [item]=S.clues.splice(from,1);
  let ti=S.clues.findIndex(c=>c.id===targetId);
  if(ti<0)S.clues.push(item); else S.clues.splice(after?ti+1:ti,0,item);
  renderSidebar();scheduleCommit();
}
function moveCard(fromKey,targetKey,after){ // cards are unique-by-name → reorder by their display key
  const keys=cardEntries().map(e=>e.key);
  const from=keys.indexOf(fromKey);if(from<0)return;
  keys.splice(from,1);
  let ti=keys.indexOf(targetKey);
  if(ti<0)keys.push(fromKey); else keys.splice(after?ti+1:ti,0,fromKey);
  S.cardOrder=keys;
  renderSidebar();scheduleCommit();
}
function moveQuestion(draggedId,targetId,after){
  const from=S.questions.findIndex(q=>q.id===draggedId);if(from<0)return;
  const [item]=S.questions.splice(from,1);
  let ti=S.questions.findIndex(q=>q.id===targetId);
  if(ti<0)S.questions.push(item); else S.questions.splice(after?ti+1:ti,0,item);
  renderSidebar();
}
function sectionRow(label,visible,onToggle){

  const l=document.createElement('span');l.textContent=label;
  const e=document.createElement('span');e.className='q-eye';e.textContent=visible?'👁':'🙈';
  d.appendChild(l);d.appendChild(e);d.onclick=onToggle;
  return d;
}
function addItemEl(label,title,onClick){
  const a=document.createElement('div');a.className='q-item q-add-item';a.textContent='＋';a.title=title;a.onclick=onClick;return a;
}
// 折りたたみ無しの小見出し（レイヤーのメイン/時系列グループ分け用）
function subHeaderRow(label){
  const d=document.createElement('div');d.className='q-subhead';d.textContent=label;
  d.style.cssText='padding:6px 4px 2px;font-size:11px;font-weight:700;letter-spacing:.04em;color:#9a9ad0;opacity:.9;cursor:default';
  return d;
}
function keyTagEl(){const s=document.createElement('span');s.textContent='🔑';s.title='キー';s.style.cssText='flex:0 0 auto;font-size:13px;margin:0 2px';return s;}
// 名前が長い場合はフォントを自動縮小して全文表示。
// 半角文字は0.55文字分として実効幅で計算（サイドバー幅いっぱい≒205pxを使う）
function fitTitle(ti,name){
  const s=name||'';
  let eff=0; for(const ch of s){ eff += /[ -ÿ｡-ﾟ]/.test(ch)?0.55:1; }
  const AVAIL=205;
  if(eff*13<=AVAIL)return;               // 13pxのままで収まる
  const fs=Math.max(9,Math.floor(AVAIL/eff));
  ti.style.fontSize=fs+'px';
  if(eff*fs>AVAIL){ ti.style.whiteSpace='normal'; ti.style.lineHeight='1.25'; ti.style.wordBreak='break-all'; } // 9pxでも収まらない時だけ折返し
}
function makeClueItem(c){
  const it=document.createElement('div');it.className='q-item clue-item';it.dataset.clueId=c.id;
  it.style.borderLeft='4px solid '+ATTRS.clue.color; // 手がかり属性色
  const th=document.createElement('span');th.className='clue-thumb';
  if(c.image){const img=document.createElement('img');img.src=c.image;img.draggable=false;th.appendChild(img);}
  else{th.textContent=c.icon||'🔍';th.style.background=ATTRS.clue.color;}
  const ti=document.createElement('span');ti.className='q-title';ti.textContent=c.name||'手がかり';ti.title=c.name||'';fitTitle(ti,c.name);
  const del=document.createElement('span');del.className='q-del';del.textContent='✕';del.title='削除';
  del.onclick=e=>{e.stopPropagation();if(confirm('この手がかりを削除しますか？'))deleteClue(c.id);};
  it.appendChild(th);it.appendChild(ti);if(c.key)it.appendChild(keyTagEl());it.appendChild(del);
  it.onclick=()=>openClueEditor(c.id);
  it.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();openClueEditor(c.id);}; // right-click → edit
  it.classList.add('q-drag-h');
  it.draggable=true;
  it.addEventListener('dragstart',ev=>{_dragClueId=c.id;try{ev.dataTransfer.effectAllowed='copyMove';ev.dataTransfer.setData('text/plain',c.id);}catch(e){}it.classList.add('q-dragging');});
  it.addEventListener('dragend',()=>{it.classList.remove('q-dragging');_dragClueId=null;});
  wireReorder(it,'clue',c.id,moveClue); // drop on canvas → place card; drop on another 手がかり → reorder
  return it;
}
let _dragCardSrc=null; // {card, fromBoard} while dragging a card from the sidebar list
function makeLayerItem(l){ // l: {id, name, color} — each layer is its own canvas (board)
  const it=document.createElement('div');it.className='q-item'+(S.currentBoard===l.id?' active':'');
  const ico=document.createElement('span');ico.className='q-ico';ico.textContent=isMainLayer(l)?'◆':'●';ico.style.color=l.color||'#9aa3b2';ico.title=isMainLayer(l)?'メインレイヤー':'時系列レイヤー';
  const ti=document.createElement('span');ti.className='q-title';ti.textContent=l.name;ti.title=l.name;fitTitle(ti,l.name);
  it.appendChild(ico);it.appendChild(ti);
  const del=document.createElement('span');del.className='q-del';del.textContent='✕';del.title='削除';
  del.onclick=e=>{e.stopPropagation();
    if(S.layers.length<=1){alert('レイヤーは最低1つ必要です。');return;}
    if(confirm('このレイヤー（図）を削除しますか？この図の内容も削除されます。'))deleteLayer(l.id);
  };
  it.appendChild(del);
  it.ondblclick=e=>{e.stopPropagation();renameLayer(l.id);};
  it.oncontextmenu=e=>{e.preventDefault();e.stopPropagation();renameLayer(l.id);};
  it.onclick=()=>switchLayer(l.id);
  wireReorder(it,'layer',l.id,moveLayer); // drag to reorder layers
  return it;
}
function focusCard(id){
  const c=cardById(id);if(!c)return;
  S.selection=[id];
  const r=wrap.getBoundingClientRect();
  S.panX=r.width/2-(c.x+cardEffW(c)/2)*S.zoom;
  S.panY=r.height/2-(c.y+cardEffH(c)/2)*S.zoom;
  applyTf();render();
}
// meta = {id,name,color} of the layer/board this card lives on (cards are shared across layers in the sidebar).
function makeCardListItem(c, boardId, boards){
  const fromBoard=boardId||S.currentBoard;
  const onCurrent=fromBoard===S.currentBoard;
  const it=document.createElement('div');it.className='q-item clue-item';it.dataset.cardId=c.id;it.dataset.cardBoard=fromBoard;it.dataset.cardkey=(c.name||'').trim()||(' '+c.id);
  const atCol=(ATTRS[attrOf(c)]||ATTRS.person).color;
  it.style.borderLeft='4px solid '+atCol; // 属性ごとの色
  const th=document.createElement('span');th.className='clue-thumb';
  if(c.image){const img=document.createElement('img');img.src=c.image;img.draggable=false;th.appendChild(img);}
  else{th.textContent=c.icon||'✦';th.style.background=atCol;}
  const ti=document.createElement('span');ti.className='q-title';ti.textContent=c.name||'カード';ti.title=c.name||'';fitTitle(ti,c.name);
  it.appendChild(th);it.appendChild(ti);if(c.key)it.appendChild(keyTagEl());
  // click → jump to the layer/疑問 the card is on (choose when it's on several), like the 疑問・伏線 list
  it.onclick=()=>{ const bs=(boards&&boards.length)?boards:[fromBoard]; const nm=(c.name||'').trim();
    bs.length>1 ? chooseKeyBoard(nm,bs) : jumpToKey(nm,bs[0]); };
  it.oncontextmenu=e=>{e.preventDefault();e.stopPropagation(); if(onCurrent)openCardEditor(c.id);}; // edit only the current canvas's card
  // drag onto canvas: same-layer card → reposition; other-layer card → place the SAME card on this layer
  it.classList.add('q-drag-h');it.draggable=true;
  it.addEventListener('dragstart',ev=>{_dragCardSrc={card:c,fromBoard};try{ev.dataTransfer.effectAllowed='copyMove';ev.dataTransfer.setData('text/plain',c.id);}catch(e){}it.classList.add('q-dragging');});
  it.addEventListener('dragend',()=>{it.classList.remove('q-dragging');_dragCardSrc=null;});
  wireReorder(it,'card',(c.name||'').trim()||(' '+c.id),moveCard); // drop on canvas → place; drop on another card → reorder list
  return it;
}
// Place a card onto the current layer's canvas. Same layer → just move it; other layer → reuse the
// same-named card here, or create a linked copy (same identity) so it's "the same card" across layers.
function placeCardOnCanvas(srcCard, fromBoard, x, y){
  if(!srcCard)return;
  let tgt, created=false;
  if(fromBoard===S.currentBoard){ tgt=srcCard; }
  else {
    tgt=S.cards.find(c=>(c.name||'').trim()===(srcCard.name||'').trim() && (srcCard.name||'').trim()!=='');
    if(!tgt){
      // 同一カードとして配置：解説・属性も共有してコピー
      tgt={id:uid(),x:0,y:0,w:srcCard.w||150,name:srcCard.name,sub:srcCard.sub||'',color:srcCard.color,
        image:srcCard.image||null,icon:srcCard.icon,shape:srcCard.shape||'rect',desc:srcCard.desc||'',textScale:srcCard.textScale||1,
        key:srcCard.key||false,zoneIds:[],linkBoard:srcCard.linkBoard,attr:srcCard.attr,chapters:(srcCard.chapters||[]).slice()};
      S.cards.push(tgt); created=true;
    }
  }
  tgt.x=clampW(x-cardEffW(tgt)/2); tgt.y=clampW(y-cardEffH(tgt)/2);
  autoLayerTag(tgt);          // このレイヤーのタグを解説に自動挿入
  syncCardByName(tgt);        // 解説を同名カード全体に共有
  S.selection=[tgt.id];
  if(created)renderAll(); else { render(); scheduleCommit(); }
}
// Drop a 疑問 onto the canvas → a "link node" card that opens that question's diagram
function placeQuestionOnCanvas(qid,x,y){
  const q=S.questions.find(q=>q.id===qid); if(!q)return;
  const w=170;
  const card={id:uid(),x:clampW(x-w/2),y:clampW(y-44),w,name:q.title||'疑問',sub:'',color:ATTRS.question.color,
    image:null,icon:'❓',shape:'rect',desc:'',textScale:1,key:false,zoneIds:[],linkBoard:qid,attr:'question',chapters:[]};
  tagChapter(card);
  S.cards.push(card);autoLayerTag(card);S.selection=[card.id];renderAll();
}

  const curCh=(S.chapter&&S.chapter!=='__all')?S.chapter:''; // 既定は現在表示中の章（全章表示中は「章なし」）
  const chOpts=`<option value="">章なし（全章に表示）</option>`+S.chapters.map(ch=>`<option value="${esc(ch)}"${ch===curCh?' selected':''}>${esc(ch)}</option>`).join('');
  showModal(`<h2>${main?'◆ メインレイヤーを追加':'⏱ 時系列レイヤー（別の図）を追加'}</h2><div class="fg"><label>${main?'メインレイヤー名':'レイヤー名（時点）'}</label><input type="text" id="ly-name" placeholder="${main?'例: 全体図 / 第1章まとめ':'例: 第2章 / 事件発生後'}"></div>
    <div class="fg"><label>章</label><select id="ly-ch">${chOpts}</select></div>
    <div class="fg" style="font-size:12px;color:#9aa3b2">${main?'時系列レイヤーのカードをドラッグで配置して、全体をまとめられる図です。':'新しい白紙の図が追加されます。'}選んだ章にレイヤーが追加されます。</div>
    <div class="mact"><button class="btn btn-s" onclick="hideModal()">キャンセル</button><button class="btn btn-p" id="ly-ok">追加</button></div>`,()=>{
    const inp=document.getElementById('ly-name');inp.focus();
    const ok=()=>{
      const ch=document.getElementById('ly-ch').value;          // ''＝章なし / それ以外は章名
      const id=addLayer(inp.value,kind,ch);
      hideModal();

    `</div>`;

function wireLayerChips(taId){
  document.querySelectorAll('.layer-chip').forEach(b=>b.onclick=()=>{
    const ta=document.getElementById(taId);if(!ta)return;
    const tag='[['+b.dataset.name+']]';
    const s=ta.selectionStart??ta.value.length, e=ta.selectionEnd??ta.value.length;
    ta.value=ta.value.slice(0,s)+tag+ta.value.slice(e);
    ta.focus();ta.selectionStart=ta.selectionEnd=s+tag.length;
  });
}

    S.clues.forEach(c=>t.appendChild(makeClueItem(c)));

// the UNIQUE card list (shared across layers, 手がかり-cards excluded), ordered by S.cardOrder.
// each entry also records `boards` = every layer/疑問 the card appears on (for jump targets).
function cardEntries(){
  saveActiveBoard(); // sync the live current canvas into S.boards first
  // contents: layers + the current board (so a 疑問's cards show while it's open)
  const contentBoards=S.layers.map(l=>l.id);
  if(!contentBoards.includes(S.currentBoard))contentBoards.push(S.currentBoard);
  const uniq=new Map();
  contentBoards.forEach(bid=>{ const bd=S.boards[bid]; if(!bd||!bd.cards)return;
    bd.cards.forEach(c=>{ if(c.linkBoard)return; // 疑問リンクノードは疑問の行が代表するため出さない
      const key=(c.name||'').trim()||(' '+c.id);
      if(!uniq.has(key)||bid===S.currentBoard)uniq.set(key,{key,card:c,boardId:bid,boards:[]}); });
  });
  // jump targets: every layer + 疑問 board that holds a same-named card
  S.layers.map(l=>l.id).concat(S.questions.map(q=>q.id)).forEach(bid=>{ const bd=S.boards[bid]; if(!bd||!bd.cards)return;
    bd.cards.forEach(c=>{ if(c.linkBoard)return;
      const e=uniq.get((c.name||'').trim()||(' '+c.id)); if(e&&!e.boards.includes(bid))e.boards.push(bid); });
  });
  const entries=[...uniq.values()], order=S.cardOrder||[];
  entries.sort((a,b)=>{ let ia=order.indexOf(a.key), ib=order.indexOf(b.key); if(ia<0)ia=1e9; if(ib<0)ib=1e9; return ia-ib; });
  return entries;
}
// チップ行の汎用
function chipRow(opts,active,onPick){
  const w=document.createElement('div');
  w.style.cssText='display:flex;flex-wrap:wrap;gap:4px;padding:2px 2px 6px;pointer-events:auto';
  opts.forEach(o=>{
    const on=active===o.k;
    const b=document.createElement('button');b.type='button';b.textContent=o.label;
    const col=o.color||'#7a7ab0';
    b.style.cssText='font-size:10.5px;padding:3px 9px;border-radius:11px;cursor:pointer;font-family:inherit;border:1px solid '+col+';background:'+(on?col:'transparent')+';color:'+(on?'#101024':'#cfcfe6')+';font-weight:'+(on?'700':'400');
    b.onclick=()=>onPick(o.k);
    w.appendChild(b);
  });
  return w;
}

  const opts=[{k:'__all',label:'全章',color:'#9a9ad0'}].concat(S.chapters.map(ch=>({k:ch,label:ch,color:'#7a5aff'})));
  return chipRow(opts,S.chapter,setChapter);

// 属性フィルタチップ（全/人物/手がかり/場所/疑問伏線）
function attrChipsRow(){
  const opts=[{k:'all',label:'全',color:null}].concat(Object.entries(ATTRS).map(([k,a])=>({k,label:a.label,color:a.color})));
  return chipRow(opts,S.cardFilter||'all',k=>{S.cardFilter=k;renderSidebar();});

// 統一カードセクション: 疑問・伏線 / 人物 / 手がかり / 場所 をひとつの一覧に（章＋属性で絞り込み）
function buildUnifiedSection(t){
  t.appendChild(sectionRow('カード',S.showCards,()=>{S.showCards=!S.showCards;renderSidebar();}));
  if(!S.showCards)return;
  t.appendChild(chapterChipsRow());
  t.appendChild(attrChipsRow());
  t.appendChild(addItemEl('＋','カードを追加（属性を選択）',addCard));
  const f=S.cardFilter||'all';
  if(f==='all'||f==='question'){
    S.questions.forEach(q=>t.appendChild(makeBoardItem({id:q.id,title:q.title,ico:'❓',isQ:true})));
    collectKeyCards().forEach(k=>t.appendChild(makeKeyItem(k))); // 🔑（手がかり以外のキー）
  }
  cardEntries().forEach(v=>{ const at=attrOf(v.card); if((f==='all'||f===at)&&inChapter(v.card))t.appendChild(makeCardListItem(v.card,v.boardId,v.boards)); });
  if(f==='all'||f==='clue'){
    const placed=new Set(); Object.values(S.boards).forEach(bd=>(bd.cards||[]).forEach(c=>placed.add((c.name||'').trim())));
    S.clues.forEach(c=>{ if(!placed.has((c.name||'').trim())&&inChapter(c))t.appendChild(makeClueItem(c)); });
  }
  // 伏線セクション（最下部・章に関係なく常時表示）
  const fk=cardEntries().filter(v=>isFukusen(v.card));
  if(fk.length){
    t.appendChild(sectionRow('🔮 伏線',true,()=>{}));
    fk.forEach(v=>t.appendChild(makeCardListItem(v.card,v.boardId,v.boards)));
  }
}
function renderSidebar(){
  const L=document.getElementById('q-list'),R=document.getElementById('q-list-right');
  if(!L||!R)return;
  const chBtn=document.getElementById('btn-chapter'); if(chBtn)chBtn.textContent='📖 '+(S.chapter==='__all'?'全章':S.chapter)+' ▾'; // 章ボタン表示を同期
  L.innerHTML='';R.innerHTML='';
  const mobile=window.matchMedia&&window.matchMedia('(max-width:760px)').matches;
  if(mobile){
    // one left drawer: レイヤー → 統一カード一覧
    buildLayerSection(L);
    buildUnifiedSection(L);
  } else {
    // desktop: 右=レイヤー（メイン＋時系列・章チップ付き） / 左=統一カード一覧（人物・手がかり・場所・疑問伏線）
    buildUnifiedSection(L);
    buildLayerSection(R,true);
  }
}
let _dragClueId=null;

  const nm=(c.name||'').trim();

  tagChapter(placed);
  S.cards.push(placed);

    <div class="fg"><label>枠の形</label><select id="cl-shape"><option value="rect"${c.shape==='rect'?' selected':''}>□ 四角</option><option value="circle"${c.shape==='circle'?' selected':''}>○ 円形</option><option value="bubble"${c.shape==='bubble'?' selected':''}>💬 吹き出し</option></select></div>
    <div class="fg"><label>アイコン（画像なし時）</label><div class="icon-grid" id="cl-icon-grid"></div>
      <div style="margin-top:8px;display:flex;align-items:center;gap:8px"><label style="font-size:11px;color:#888">カスタム絵文字</label><input type="text" id="cl-cicon" value="${esc(c.icon)}" style="width:60px;text-align:center;font-size:18px"></div></div>
    <div class="fg"><label>画像</label><div style="display:flex;gap:8px;align-items:center"><button class="btn btn-s" id="cl-imgbtn">📁 画像を選択</button>${c.image?'<button class="btn btn-s" id="cl-clrimg">🗑 削除</button><img src="'+c.image+'" style="height:40px;border-radius:4px">':''}</div></div>
    <div class="fg"><label>幅 (px)</label><input type="number" id="cl-w" value="${c.w||150}" min="80" max="600" style="width:80px"></div>
    <div class="fg"><label>解説（同名カードと共有・Ctrl+Enterで改行）</label><textarea id="cl-desc">${esc(c.desc||'')}</textarea></div>
    <div class="mact"><button class="btn btn-d" id="cl-del">🗑 削除</button><button class="btn btn-p" onclick="hideModal()">閉じる</button></div>
  `,()=>{
    const $=x=>document.getElementById(x);
    buildIconGrid('cl-icon-grid',c.icon,v=>{$('cl-cicon').value=v;c.icon=v;renderAll();scheduleCommit();});
    // 入力は即時反映（自動保存）。名称変更は同名カードにも伝搬、解説も共有。
    let prevName=c.name;
    $('cl-name').addEventListener('input',()=>{ const nv=$('cl-name').value; renameCardEverywhere(prevName,nv); c.name=nv; prevName=nv; renderAll(); scheduleCommit(); });
    $('cl-sub').addEventListener('input',()=>{ c.sub=$('cl-sub').value; scheduleCommit(); });
    $('cl-color').addEventListener('input',()=>{ c.color=$('cl-color').value; renderAll(); scheduleCommit(); });
    $('cl-shape').onchange=()=>{ c.shape=$('cl-shape').value; scheduleCommit(); };
    $('cl-cicon').addEventListener('input',()=>{ c.icon=$('cl-cicon').value||'🔍'; renderAll(); scheduleCommit(); });
    $('cl-w').addEventListener('input',()=>{ c.w=parseInt($('cl-w').value)||150; scheduleCommit(); });
    $('cl-desc').addEventListener('input',()=>{ c.desc=$('cl-desc').value;
      const nm=(c.name||'').trim();
      if(nm){ saveActiveBoard(); Object.values(S.boards).forEach(bd=>(bd.cards||[]).forEach(cc=>{ if((cc.name||'').trim()===nm)cc.desc=c.desc; })); }
      render(); scheduleCommit(); });
    document.querySelectorAll('.color-preset').forEach(p=>p.addEventListener('click',()=>{ $('cl-color').value=p.dataset.col; c.color=p.dataset.col; renderAll(); scheduleCommit(); }));
    const imgInp=document.createElement('input');imgInp.type='file';imgInp.accept='image/*';
    imgInp.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{c.image=ev.target.result;renderAll();scheduleCommit();openClueEditor(id);};r.readAsDataURL(f);};
    $('cl-imgbtn').onclick=()=>imgInp.click();
    const clr=$('cl-clrimg');if(clr)clr.onclick=()=>{c.image=null;renderAll();scheduleCommit();openClueEditor(id);};
    $('cl-del').onclick=()=>{deleteClue(id);hideModal();};
  });
}
