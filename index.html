const touchDist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
let _tPan=null,_pinch=null;
// canvas pan (1 finger) + pinch zoom (2 fingers)
wrap.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    e.preventDefault();_tPan=null;
    const[a,b]=e.touches;
    _pinch={d:touchDist(a,b)};
  } else if(e.touches.length===1){
    const t=e.touches[0];
    if(t.target.closest&&t.target.closest('.card,.branch,.subtitle,.imgel,.desc-box,.card-add-btn,.alabel,.ahit'))return; // element handles itself
    e.preventDefault();
    if(S.connecting){cancelConnect();}
    clearSelection();
    _tPan={sx:t.clientX,sy:t.clientY,px:S.panX,py:S.panY};_pinch=null;
  }
},{passive:false});
wrap.addEventListener('touchmove',e=>{
  if(_pinch&&e.touches.length===2){
    e.preventDefault();
    const[a,b]=e.touches;const nd=touchDist(a,b);
    const f=nd/_pinch.d;_pinch.d=nd;
    zoomAt((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2,f);
  } else if(_tPan&&e.touches.length===1){
    e.preventDefault();
    const t=e.touches[0];
    S.panX=_tPan.px+(t.clientX-_tPan.sx);S.panY=_tPan.py+(t.clientY-_tPan.sy);applyTf();
  }
},{passive:false});
const endTouchPan=e=>{ if(e.touches.length===0){_tPan=null;_pinch=null;} else if(e.touches.length<2)_pinch=null; };
wrap.addEventListener('touchend',endTouchPan);
wrap.addEventListener('touchcancel',endTouchPan);

// element touch: tap=edit, drag=move, long-press=menu, (while connecting) tap=connect
function openEditorForElement(id,x,y){
  if(cardById(id))openCardEditor(id);
  else if(branchById(id))openBranchEditor(id);
  else if(S.subtitles.find(s=>s.id===id))openSubtitleEditor(id);
  else if(S.images.find(i=>i.id===id))onImageCtx({clientX:x,clientY:y,preventDefault(){},stopPropagation(){}},id);
}
function openCtxForElement(id,x,y){
  const fake={clientX:x,clientY:y,preventDefault(){},stopPropagation(){}};
  if(cardById(id))onCardCtx(fake,id);
  else if(branchById(id))onBranchCtx(fake,id);
  else if(S.subtitles.find(s=>s.id===id))onSubtitleCtx(fake,id);
  else if(S.images.find(i=>i.id===id))onImageCtx(fake,id);
}
function elementTouchStart(e,id){
  if(e.touches.length!==1)return;
  e.stopPropagation();e.preventDefault();
  if(S.connecting){ if(S.connecting.fromId!==id){createArrow(S.connecting.fromId,id);S.connecting=null;render();} return; }
  const t=e.touches[0];const sx=t.clientX,sy=t.clientY;
  const node=selById(id);if(!node)return;
  const ox=node.x,oy=node.y;
  let moved=false,longFired=false;
  const lp=setTimeout(()=>{ if(!moved){longFired=true;cleanup();openCtxForElement(id,sx,sy);} },480);
  const move=(cx,cy)=>{
    if(longFired)return;
    if(!moved&&(Math.abs(cx-sx)>7||Math.abs(cy-sy)>7)){moved=true;clearTimeout(lp);}
    if(moved){
      const sp=s2c(sx,sy),cp=s2c(cx,cy);
      node.x=clampW(ox+(cp.x-sp.x));node.y=clampW(oy+(cp.y-sp.y));
      const el=elems.querySelector(`[data-id="${id}"]`);if(el){el.style.left=node.x+'px';el.style.top=node.y+'px';}
      renderArrows();renderLabels();renderZones();renderDescs();
    }
  };
  const tm=ev=>{if(ev.touches[0]){ev.preventDefault();move(ev.touches[0].clientX,ev.touches[0].clientY);}};
  const te=()=>{cleanup();if(longFired)return;if(!moved)openEditorForElement(id,sx,sy);else scheduleCommit();};
  function cleanup(){clearTimeout(lp);window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);window.removeEventListener('touchcancel',te);}
  window.addEventListener('touchmove',tm,{passive:false});window.addEventListener('touchend',te);window.addEventListener('touchcancel',te);
}
function connectTouchStart(e,fromId){
  if(e.touches.length!==1)return;
  e.stopPropagation();e.preventDefault();
  S.connecting={fromId};S.mouse=s2c(e.touches[0].clientX,e.touches[0].clientY);render();
  const tm=ev=>{if(ev.touches[0]){ev.preventDefault();S.mouse=s2c(ev.touches[0].clientX,ev.touches[0].clientY);updateTempArrow();}};
  const te=ev=>{
    window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);
    const ch=ev.changedTouches[0];
    const tgt=ch?document.elementFromPoint(ch.clientX,ch.clientY):null;
    const host=tgt&&tgt.closest&&tgt.closest('.card,.branch');
    if(host&&host.dataset.id&&host.dataset.id!==fromId)createArrow(fromId,host.dataset.id);
    S.connecting=null;render();
  };
  window.addEventListener('touchmove',tm,{passive:false});window.addEventListener('touchend',te);
}
function descTouchStart(e,id){
  if(e.touches.length!==1)return;
  const tag=e.target.closest&&e.target.closest('.layer-tag');
  if(tag){e.stopPropagation();e.preventDefault();jumpToLayer(tag.dataset.layer,tag.dataset.card);return;} // tap tag → jump to that layer's canvas
  e.stopPropagation();e.preventDefault();
  const owner=ownerByDescId(id);if(!owner)return;const kind=descKindOf(id);
  const dbox=elems.querySelector(`.desc-box[data-desc-id="${id}"]`);
  const a=descAnchor(owner,kind)||{x:0,y:0};
  const off0=(owner.descMoved&&owner.descOff)?{x:owner.descOff.x,y:owner.descOff.y}
            :{x:(parseFloat(dbox&&dbox.style.left)||a.x)-a.x, y:(parseFloat(dbox&&dbox.style.top)||a.y)-a.y};
  const start=s2c(e.touches[0].clientX,e.touches[0].clientY);
  const tm=ev=>{if(ev.touches[0]){ev.preventDefault();const cp=s2c(ev.touches[0].clientX,ev.touches[0].clientY);owner.descMoved=true;owner.descOff={x:clampW(off0.x+(cp.x-start.x)),y:clampW(off0.y+(cp.y-start.y))};renderDescs();}};
  const te=()=>{window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);scheduleCommit();};
  window.addEventListener('touchmove',tm,{passive:false});window.addEventListener('touchend',te);
}
// delegate element touches on the canvas layer
elems.addEventListener('touchstart',e=>{
  const t=e.target;
  const addBtn=t.closest&&t.closest('.card-add-btn');
  if(addBtn){const host=addBtn.closest('.card,.branch');if(host)connectTouchStart(e,host.dataset.id);return;}
  const lb=t.closest&&t.closest('.link-badge');
  if(lb){e.stopPropagation();e.preventDefault();const host=lb.closest('.card');const c=host&&cardById(host.dataset.id);if(c&&c.linkBoard)openLinkBoard(c.linkBoard);return;}
  const descBox=t.closest&&t.closest('.desc-box');
  if(descBox){descTouchStart(e,descBox.dataset.descId);return;}
  const el=t.closest&&t.closest('.card,.branch,.subtitle,.imgel');
  if(el)elementTouchStart(e,el.dataset.id);
},{passive:false});
// arrow line tap (touch) → open arrow editor / place branch
arrsG.addEventListener('touchstart',e=>{

  if(!hit)return;

},{passive:false});

// list-item touch: vertical swipe = scroll the panel; horizontal drag = onto canvas; tap = the item's onclick
// (no touchstart preventDefault → panel scroll & tap-click work)
function listDragTouch(e,onDrop){
  if(e.touches.length!==1)return;
  const t=e.touches[0];const sx=t.clientX,sy=t.clientY;let drag=false,decided=false;
  const tm=ev=>{ if(!ev.touches[0])return;
    const dx=ev.touches[0].clientX-sx,dy=ev.touches[0].clientY-sy;
    if(!decided){ if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>6)decided=true; else if(Math.abs(dx)>8){decided=true;drag=true;} }
    if(drag)ev.preventDefault();
  };
  const te=ev=>{ window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);
    if(drag){const ch=ev.changedTouches[0];const r=wrap.getBoundingClientRect();
      if(ch&&ch.clientX>=r.left&&ch.clientX<=r.right&&ch.clientY>=r.top&&ch.clientY<=r.bottom)onDrop(s2c(ch.clientX,ch.clientY));}
  };
  window.addEventListener('touchmove',tm,{passive:false});window.addEventListener('touchend',te);
}
function clueTouchStart(e,clueId){ listDragTouch(e,pt=>placeClueOnCanvas(clueId,pt.x,pt.y)); } // tap → onclick (edit)
function questionTouchStart(e,qid){ listDragTouch(e,pt=>placeQuestionOnCanvas(qid,pt.x,pt.y)); } // drag → link node; tap → onclick (open board)
function cardListTouchStart(e,cardId,fromBoard){ // drag a card onto the canvas (cross-layer = place the same card here); tap → onclick
  const src = fromBoard===S.currentBoard ? cardById(cardId)
            : ((S.boards[fromBoard]&&S.boards[fromBoard].cards||[]).find(c=>c.id===cardId));
  if(!src)return;
  listDragTouch(e,pt=>placeCardOnCanvas(src,fromBoard,pt.x,pt.y));
}
function sidebarTouchDelegate(e){
  const it=e.target.closest&&e.target.closest('.clue-item,.q-item[data-qid]');
  if(!it)return;
  if(it.dataset.clueId)clueTouchStart(e,it.dataset.clueId);
  else if(it.dataset.cardId)cardListTouchStart(e,it.dataset.cardId,it.dataset.cardBoard);
  else if(it.dataset.qid)questionTouchStart(e,it.dataset.qid);
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    cancelConnect();
    if(S.mode==='branch'){S.mode='normal';document.getElementById('btn-branch-mode').classList.remove('active');render();}
    return;
  }
  // ignore shortcuts while typing in a field / modal input
  const t=e.target, tag=(t&&t.tagName)||'';
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)||(t&&t.isContentEditable))return;
  if(!(e.ctrlKey||e.metaKey))return;
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo();}
  else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();} // Ctrl+Y or Ctrl+Shift+Z
  else if(k==='b'){e.preventDefault();addCard();}                      // new card
  else if(k==='s'){e.preventDefault();saveFile();}                     // save
});

// ── SAVE ──
function saveFile(){
  saveActiveBoard();
  const data={
    title:'ClueBoard',
    version:2,
    bg:S.bg,showDesc:S.showDesc,
    docTitle:S.docTitle,
    currentBoard:S.currentBoard,
    layers:S.layers,
    questions:S.questions,
    clues:S.clues,
    cardOrder:S.cardOrder,
    showMain:S.showMain,
    showCards:S.showCards,showLayers:S.showLayers,
    showQuestions:S.showQuestions,
    showClues:S.showClues,
    boards:S.boards,
    // also include the active board's arrays flat for older readers
    cards:S.cards,arrows:S.arrows,branches:S.branches,
    zones:S.zones,subtitles:S.subtitles,images:S.images
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const safe=(S.docTitle||'').trim().replace(/[\\/:*?"<>|\n\r\t]/g,'_').replace(/\s+/g,'_').slice(0,80);
  a.download=(safe||('relationship_'+(new Date().toISOString().slice(0,10))))+'.json';
  a.click();URL.revokeObjectURL(a.href);
}

// document title (top-left) → kept in S.docTitle and used as the save filename
(function wireDocTitle(){
  const inp=document.getElementById('doc-title'); if(!inp)return;

  inp.addEventListener('input',()=>{ S.docTitle=inp.value; autosaveLocalDebounced(); cloudSaveDebounced(); });

// Apply a saved document object to the app state (shared by file-load and cloud-load)
function applyDocData(d){
  _loadingDoc=true;
  S.bg=d.bg||'grid';
  S.showDesc=d.showDesc!==false;
  S.clues=d.clues||[];
  S.cardOrder=d.cardOrder||[];
  S.docTitle=d.docTitle||'';
  const _dt=document.getElementById('doc-title'); if(_dt)_dt.value=S.docTitle;
  S.showMain=d.showMain!==false;
  S.showCards=d.showCards!==false; S.showLayers=d.showLayers!==false;
  S.showQuestions=d.showQuestions!==false;
  S.showClues=d.showClues!==false;
  if(d.boards){
    S.boards=d.boards;
    S.questions=d.questions||[];
    S.currentBoard=(d.currentBoard&&d.boards[d.currentBoard])?d.currentBoard:'main';
    if(!S.boards.main)S.boards.main=BLANK_BOARD();
  } else {
    S.boards={main:{cards:d.cards||[],arrows:d.arrows||[],branches:d.branches||[],zones:d.zones||[],subtitles:d.subtitles||[],images:d.images||[]}};
    S.questions=[]; S.currentBoard='main';
  }
  // time-series layers are a global list of canvases; migrate older docs (mainTitle → レイヤー1)
  S.layers=Array.isArray(d.layers)?d.layers.slice():[];
  ensureLayers(d.mainTitle);
  if(!S.layers.some(l=>l.id===S.currentBoard) && !S.questions.some(q=>q.id===S.currentBoard)) S.currentBoard='main';
  loadActiveBoard();
  document.getElementById('bg-sel').value=S.bg;
  document.getElementById('btn-toggle-desc').classList.toggle('active',S.showDesc);
  render();applyTf();renderSidebar();resetHistory();
  _loadingDoc=false;
}
function currentDocData(){
  saveActiveBoard();
  return {title:'ClueBoard',version:2,bg:S.bg,showDesc:S.showDesc,currentBoard:S.currentBoard,layers:S.layers,
    questions:S.questions,clues:S.clues,cardOrder:S.cardOrder,docTitle:S.docTitle,showMain:S.showMain,showCards:S.showCards,showLayers:S.showLayers,showQuestions:S.showQuestions,showClues:S.showClues,boards:S.boards};
}

document.getElementById('file-input').onchange=e=>{

};

    });
    fbAuth=firebase.auth(); fbDb=firebase.firestore();
    fbAuth.onAuthStateChanged(onAuthChanged);
    // handle returning from a redirect sign-in (mobile)
    fbAuth.getRedirectResult&&fbAuth.getRedirectResult().catch(()=>{});
  }catch(e){ console.warn('Firebase init failed',e); }
})();
function cloudReady(){return !!(fbAuth&&fbDb);}
function setCloudStatus(t){const s=document.getElementById('cloud-status');if(s)s.textContent=t||'';}
function hashDocId(){return (location.hash.match(/doc=([\w-]+)/)||[])[1]||null;}
function updateCloudUI(){
  const lb=document.getElementById('btn-login'),sb=document.getElementById('btn-share');
  if(!lb)return;
  if(!cloudReady()){lb.textContent='👤 ログイン(未設定)';lb.disabled=true;if(sb)sb.disabled=true;return;}
  if(fbUser){
    const nm=(fbUser.displayName||'ユーザー').split(' ')[0];
    lb.textContent='👤 '+nm+'（ログアウト）';lb.classList.add('in');lb.title='クリックでログアウト';
    if(sb)sb.disabled=false;
  } else {
    lb.textContent='👤 Googleでログイン';lb.classList.remove('in');lb.title='';
    if(sb)sb.disabled=true; setCloudStatus('');
  }
}
let _loginPromptShown=false;
function promptLogin(){
  if(!cloudReady()||fbUser)return;
  showModal(`<h2>👤 Googleでログイン</h2>
    <div class="fg" style="color:#cfcfe6;font-size:13px;line-height:1.7">ログインすると、作った図が<b>クラウドに自動保存</b>され、<b>共有リンク</b>で他の人と同じ図を編集できます。<br>ログインせずローカルのまま使うこともできます。</div>
    <div class="mact">
      <button class="btn btn-s" onclick="hideModal()">ログインせずに使う</button>
      <button class="btn btn-p" id="lp-login">Googleでログイン</button>
    </div>`,()=>{
    document.getElementById('lp-login').onclick=()=>{hideModal();cloudLogin();};
  });
}
function onAuthChanged(user){
  fbUser=user||null; updateCloudUI();
  if(user){
    const h=hashDocId();
    cloudDocId = h || user.uid;
    cloudLoad(cloudDocId, !h); // own doc auto-created if missing; shared doc must exist
  } else {
    cloudDocId=null;
    // not signed in → prompt the Google login once (the actual popup opens on the button = reliable across browsers)
    if(!_loginPromptShown){ _loginPromptShown=true; setTimeout(promptLogin,300); }
  }
}
function cloudLogin(){
  if(!cloudReady())return alert('Firebaseが読み込まれていません（オフライン/ファイル直開きでは利用できません）。公開URLで試してください。');
  const p=new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(p).catch(err=>{
    if(err&&/popup|cancelled|disallowed/i.test((err.code||'')+(err.message||''))){ try{fbAuth.signInWithRedirect(p);}catch(_){ alert('ログイン失敗: '+(err.message||err)); } }
    else alert('ログイン失敗: '+(err.message||err));
  });
}
function cloudLoad(docId, createIfMissing){
  if(!cloudReady())return;
  setCloudStatus('☁ 読込中…');
  fbDb.collection('docs').doc(docId).get().then(snap=>{
    if(snap.exists && snap.data() && snap.data().data){ applyDocData(snap.data().data); setCloudStatus('☁ 読込完了'); }
    else if(createIfMissing){ cloudSaveNow(); }   // first sign-in → push current work as your doc
    else { setCloudStatus('⚠ 共有データが見つかりません'); }
  }).catch(e=>{ setCloudStatus('☁ 読込失敗'); console.warn('cloudLoad',e); });
}
function cloudSaveNow(){
  if(!cloudReady()||!fbUser||!cloudDocId)return;
  setCloudStatus('☁ 保存中…');
  const payload={ lastEditor:fbUser.uid, updatedAt:firebase.firestore.FieldValue.serverTimestamp(), data:currentDocData() };
  if(cloudDocId===fbUser.uid)payload.owner=fbUser.uid;
  fbDb.collection('docs').doc(cloudDocId).set(payload,{merge:true})
    .then(()=>setCloudStatus('☁ 保存済み'))
    .catch(e=>{setCloudStatus('☁ 保存失敗');console.warn('cloudSave',e);});
}
function cloudSaveDebounced(){
  if(_loadingDoc||!cloudReady()||!fbUser||!cloudDocId)return;
  clearTimeout(_cloudTimer); _cloudTimer=setTimeout(cloudSaveNow,2000);
}
function cloudShare(){
  if(!fbUser||!cloudDocId){alert('共有するにはログインしてください');return;}
  const url=location.origin+location.pathname+'#doc='+cloudDocId;
  cloudSaveNow();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>setCloudStatus('🔗 共有リンクをコピーしました'),()=>{});
  }
  prompt('この共有リンクを相手に渡してください（相手もGoogleログインで同じ図を編集できます）:', url);
}
document.getElementById('btn-login').onclick=()=>{ if(fbUser)fbAuth.signOut(); else cloudLogin(); };
document.getElementById('btn-share').onclick=cloudShare;
window.addEventListener('hashchange',()=>{ if(fbUser){ const h=hashDocId(); if(h&&h!==cloudDocId){ cloudDocId=h; cloudLoad(h,false);} } });
updateCloudUI();

// ═══════════════════════════════════════
//  BOOT SCREEN (GameCube-style intro)
// ═══════════════════════════════════════
(function boot(){
  const screen=document.getElementById('boot-screen');
  if(!screen)return;
  let gone=false,actx=null,played=false;
  function remove(skip){
    if(gone)return;gone=true;
    if(skip)screen.classList.add('skip');
    setTimeout(()=>screen.remove(),skip?380:60);
  }
  // GameCube-ish chime: low thud + shimmering rising arpeggio. Fires once, as soon as audio is allowed.
  function chime(){
    if(played)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      if(!actx)actx=new AC();
      if(actx.state==='suspended')actx.resume();
      if(actx.state!=='running')return; // autoplay blocked — retry on next user gesture
      played=true;
      const ctx=actx,t0=ctx.currentTime+0.03;
      const master=ctx.createGain();master.connect(ctx.destination);
      master.gain.setValueAtTime(0.0001,t0);
      master.gain.exponentialRampToValueAtTime(0.5,t0+0.05);
      master.gain.exponentialRampToValueAtTime(0.18,t0+1.6);
      master.gain.exponentialRampToValueAtTime(0.0001,t0+2.7);
      const lo=ctx.createOscillator(),lg=ctx.createGain();
      lo.type='sine';lo.frequency.setValueAtTime(120,t0);lo.frequency.exponentialRampToValueAtTime(48,t0+0.5);
      lg.gain.setValueAtTime(0.6,t0);lg.gain.exponentialRampToValueAtTime(0.001,t0+0.6);
      lo.connect(lg);lg.connect(master);lo.start(t0);lo.stop(t0+0.7);
      const notes=[392,523.25,587.33,783.99,880,1046.5];
      notes.forEach((f,i)=>{
        const st=t0+0.18+i*0.12;
        ['triangle','sine'].forEach((tp,k)=>{
          const o=ctx.createOscillator(),g=ctx.createGain();
          o.type=tp;o.frequency.value=f*(k?2:1);
          g.gain.setValueAtTime(0.0001,st);
          g.gain.exponentialRampToValueAtTime(k?0.06:0.16,st+0.04);
          g.gain.exponentialRampToValueAtTime(0.0001,st+1.1);
          o.connect(g);g.connect(master);o.start(st);o.stop(st+1.2);
        });
      });
    }catch(e){}
  }
  // Audio needs a user gesture (browser autoplay policy) — create the context only then.
  const kick=()=>{chime();if(played){window.removeEventListener('pointerdown',kick);window.removeEventListener('keydown',kick);}};
  window.addEventListener('pointerdown',kick);
  window.addEventListener('keydown',kick);
  // dismiss: click to skip, or auto after the animation
  screen.addEventListener('click',()=>{chime();remove(true);});
  setTimeout(()=>remove(false),4700);
})();
</script>
