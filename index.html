  S.images.forEach(im=>{if(im.desc&&im.desc.trim())want.push({id:im.id,owner:im,kind:'image'});});
  const hovMode=!S.showDesc;
  const ex=new Map();
  elems.querySelectorAll('.desc-box[data-desc-id]').forEach(e=>ex.set(e.dataset.descId,e));
  const lex=new Map();
  descLinesG.querySelectorAll('[data-desc-id]').forEach(l=>lex.set(l.dataset.descId,l));
  // obstacles for auto-placement (descs avoid these); placed desc boxes are added as we go so they don't overlap each other
  const obstacles=[];
  S.cards.forEach(c=>obstacles.push({x:c.x,y:c.y,w:cardEffW(c),h:cardEffH(c)}));
  S.branches.forEach(b=>obstacles.push({x:b.x,y:b.y,w:40,h:40}));
  S.images.forEach(im=>obstacles.push({x:im.x,y:im.y,w:im.w,h:im.h}));
  S.arrows.forEach(a=>{const m=arrowMid(a);if(m)obstacles.push({x:m.x-36,y:m.y-14,w:72,h:28});}); // arrow label area

  want.forEach(w=>{
    const a=descAnchor(w.owner,w.kind);
    if(!a)return;
    let box=ex.get(w.id);
    if(!box){
      box=document.createElement('div');box.className='desc-box';box.dataset.descId=w.id;
      box.addEventListener('mousedown',e=>onDescMousedown(e,w.id,w.kind));
      box.addEventListener('contextmenu',e=>{e.preventDefault();e.stopPropagation();onDescCtx(e,w.id,w.kind)});
      box.addEventListener('click',e=>{const t=e.target.closest&&e.target.closest('.layer-tag');if(t){e.stopPropagation();jumpToLayer(t.dataset.layer,t.dataset.card);}});
      elems.appendChild(box);
    } else ex.delete(w.id);
    box.innerHTML=descHtml(w.owner.desc, w.kind==='card'?w.owner.name:''); // [[layer]] → jump-link to that layer's canvas (focus same-named card)
    box.style.fontSize=(11*(w.owner.descScale||1)*txtMul())+'px';
    box.classList.toggle('hovonly',hovMode); if(!hovMode)box.classList.remove('hov');
    // 右下ドラッグで解説サイズ変更（innerHTMLで毎回消えるため都度付け直す）
    ensureRsz(box,e=>{ const o=ownerByDescId(w.id); if(!o)return;
      rszDrag(e,{w:box.offsetWidth,sc:o.descScale||1},(s0,d)=>{ o.descScale=Math.min(3,Math.max(.5,s0.sc*(s0.w+d)/s0.w)); renderDescs(); }); });
    const bw=box.offsetWidth||120, bh=box.offsetHeight||40;
    // respect a desc the user has dragged; otherwise auto-place it to avoid overlapping cards/arrows/other descs
    // 捜査ボードのカード付箋は既定でカード右下の辺に少しだけ接地する位置（動画の見た目）
    const off=(w.owner.descMoved&&w.owner.descOff) ? w.owner.descOff
            : (S.boardMode&&w.kind==='card') ? {x:cardEffW(w.owner)/2*0.45, y:cardEffH(w.owner)/2-12}
            : pickDescOff(a, ownerRectOf(w.owner,w.kind), defaultDescOff(w.owner,w.kind), bw, bh, obstacles);
    const bx=a.x+off.x, by=a.y+off.y;
    box.style.left=bx+'px';box.style.top=by+'px';
    obstacles.push({x:bx,y:by,w:bw,h:bh}); // subsequent descs avoid this box
    // dotted leader line, clipped to the box edge
    let line=lex.get(w.id);
    if(!line){line=svgE('line',{'data-desc-id':w.id,stroke:'rgba(175,160,255,.6)','stroke-width':1.4,'stroke-dasharray':'5,4'});descLinesG.appendChild(line);}
    else lex.delete(w.id);
    line.classList.toggle('hovonly',hovMode); if(!hovMode)line.classList.remove('hov');
    const bcx=bx+bw/2, bcy=by+bh/2;
    const ep=rectEdgePt(bcx,bcy,bw/2+2,bh/2+2,a.x,a.y);
    line.setAttribute('x1',a.x);line.setAttribute('y1',a.y);
    line.setAttribute('x2',ep.x);line.setAttribute('y2',ep.y);
  });
  ex.forEach(e=>e.remove());
  lex.forEach(l=>l.remove());
}
// 解説OFF時: カード/分岐/画像/矢印ラベル（または解説ボックス自身）にカーソルを近づけると該当の解説を表示
let _hovDescId=null,_hovDescTimer=null;
function applyDescHover(id,on){
  const b=elems.querySelector(`.desc-box[data-desc-id="${id}"]`); if(b)b.classList.toggle('hov',on);
  const l=descLinesG.querySelector(`[data-desc-id="${id}"]`); if(l)l.classList.toggle('hov',on);
}
elems.addEventListener('mouseover',e=>{
  if(S.showDesc)return;
  const el=e.target.closest&&e.target.closest('.desc-box,.card,.branch,.imgel,.alabel');
  if(!el)return;
  const id=el.dataset.descId||el.dataset.id;
  if(!id||!ownerByDescId(id))return;
  clearTimeout(_hovDescTimer);
  if(_hovDescId&&_hovDescId!==id)applyDescHover(_hovDescId,false);
  _hovDescId=id;applyDescHover(id,true);
});
elems.addEventListener('mouseout',()=>{
  if(S.showDesc)return;
  clearTimeout(_hovDescTimer);
  _hovDescTimer=setTimeout(()=>{ if(_hovDescId){applyDescHover(_hovDescId,false);_hovDescId=null;} },160);
});
function onDescMousedown(e,id,kind){
  if(e.button!==0)return;
  if(e.target.classList&&e.target.classList.contains('layer-tag')){e.stopPropagation();return;} // let the tag click switch layers
  e.stopPropagation();e.preventDefault();
  const owner=ownerByDescId(id);if(!owner)return;
  const box=elems.querySelector(`.desc-box[data-desc-id="${id}"]`);
  const a=descAnchor(owner,kind)||{x:0,y:0};
  // start the drag from wherever the box is currently shown (auto-placed or previously moved)
  const off0=(owner.descMoved&&owner.descOff)?{x:owner.descOff.x,y:owner.descOff.y}
            :{x:(parseFloat(box&&box.style.left)||a.x)-a.x, y:(parseFloat(box&&box.style.top)||a.y)-a.y};
  const start=s2c(e.clientX,e.clientY);
  if(box)box.classList.add('dragging');
  const onMove=ev=>{
    const cp=s2c(ev.clientX,ev.clientY);
    owner.descMoved=true; // user positioned it → stop auto-placing this desc
    owner.descOff={x:clampW(off0.x+(cp.x-start.x)),y:clampW(off0.y+(cp.y-start.y))};
    renderDescs();
  };
  const onUp=()=>{
    window.removeEventListener('mousemove',onMove);window.removeEventListener('mouseup',onUp);
    if(box)box.classList.remove('dragging');
    scheduleCommit(); // record desc move for undo
  };
  window.addEventListener('mousemove',onMove);window.addEventListener('mouseup',onUp);
}
function onDescCtx(e,id,kind){
  const owner=ownerByDescId(id);if(!owner)return;
  showCtx(e.clientX,e.clientY,[
    {slider:true,label:'解説サイズ',min:.5,max:3,step:.05,value:owner.descScale||1,oninput:v=>{owner.descScale=v;renderDescs();}},
    'sep',
    {icon:'✏️',label:'解説を編集',action:()=>{
      if(kind==='card')openCardEditor(id);else if(kind==='branch')openBranchEditor(id);
      else if(kind==='image')openDescInput(id);else openArrowEditor(id);
    }}
  ]);
}

// Drag from a card/branch + button to another node to create an arrow
function beginConnectDrag(fromId,ev){
  if(ev.button!==0)return;
  ev.stopPropagation();ev.preventDefault();
  S.connecting={fromId};
  S.mouse=s2c(ev.clientX,ev.clientY);

  render();
  const onMove=e=>{S.mouse=s2c(e.clientX,e.clientY);updateTempArrow();};
  const onUp=e=>{
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onUp);
    const tgt=document.elementFromPoint(e.clientX,e.clientY);
    const host=tgt&&tgt.closest&&tgt.closest('.card,.branch');
    if(host&&host.dataset.id&&host.dataset.id!==fromId){
      createArrow(fromId,host.dataset.id);
    }

}

function onArrowHitClick(e,arrId){

// ═══════════════════════════════════════
//  MOUSEDOWN on draggable elements
// ═══════════════════════════════════════
function onCardMousedown(e,id){
  if(e.button!==0)return;
  e.stopPropagation();

  // Ctrl+Click → toggle multi-selection (no drag / no editor)
  if(e.ctrlKey||e.metaKey){ toggleSelect(id); return; }

  // If connecting, try to connect
  if(S.connecting){
    if(S.connecting.fromId!==id){
      createArrow(S.connecting.fromId,id);
      S.connecting=null;
      render();
    }
    return;
  }

  const pt=s2c(e.clientX,e.clientY);
  // drag the whole multi-selection if this element belongs to it; otherwise a single element
  const groupMode = S.selection.length>1 && S.selection.includes(id);
  let group;
  if(groupMode){
    group=S.selection.map(sid=>{const n=selById(sid);return n?{n,ox:n.x,oy:n.y}:null;}).filter(Boolean);
  } else {
    if(S.selection.length)clearSelection(); // plain click clears a multi-selection
    const node=selById(id); if(!node)return;
    group=[{n:node,ox:node.x,oy:node.y}];
  }
  let moved=false;
  S.dragging={id,group:groupMode};

  const onMove=ev=>{
    const cp=s2c(ev.clientX,ev.clientY);
    const dx=cp.x-pt.x,dy=cp.y-pt.y;
    if(Math.abs(dx)>3||Math.abs(dy)>3)moved=true;
    group.forEach(g=>{
      g.n.x=clampW(g.ox+dx);g.n.y=clampW(g.oy+dy);
      const el=elems.querySelector(`[data-id="${g.n.id}"]`);
      if(el){el.style.left=g.n.x+'px';el.style.top=g.n.y+'px';}
    });
    renderArrows();renderLabels();renderZones();renderDescs();
  };
  const onUp=ev=>{
    window.removeEventListener('mousemove',onMove);
    window.removeEventListener('mouseup',onUp);
    if(!moved && !groupMode){
      const card=cardById(id),br=branchById(id);
      if(card)openCardEditor(id);
      else if(br)openBranchEditor(id);
      // subtitle dblclick handles itself; image contextmenu
    } else if(moved){
      scheduleCommit(); // record the move for undo
    }
    S.dragging=null;
  };
  window.addEventListener('mousemove',onMove);
  window.addEventListener('mouseup',onUp);
}

// ═══════════════════════════════════════
function showModal(html,onShown){
  modBox.innerHTML=html;
  modOv.classList.add('show');
  if(onShown)onShown();
  // テキスト入力の改行ルール: Ctrl+Enter=改行 / Enter単独=改行しない（モーダルを閉じて確定）
  modBox.querySelectorAll('textarea').forEach(ta=>{
    if(ta.classList.contains('ta-line')){ // 1行欄は内容に合わせて自動伸長
      const grow=()=>{ ta.style.height='auto'; ta.style.height=Math.min(200,Math.max(36,ta.scrollHeight))+'px'; };
      ta.addEventListener('input',grow); grow();
    }
    ta.addEventListener('keydown',e=>{
      if(e.key!=='Enter')return;
      e.preventDefault();
      if(e.ctrlKey||e.metaKey){
        const s=ta.selectionStart??ta.value.length, en=ta.selectionEnd??ta.value.length;
        ta.value=ta.value.slice(0,s)+'\n'+ta.value.slice(en);
        ta.selectionStart=ta.selectionEnd=s+1;
        ta.dispatchEvent(new Event('input',{bubbles:true}));
      } else hideModal(); // Enter単独=確定して閉じる（自動保存済み）
    });
  });
}
function hideModal(){modOv.classList.remove('show');}
modOv.addEventListener('mousedown',e=>{if(e.target===modOv)hideModal();});

function renderZoneList(cardId){
  const list=document.getElementById('zone-list');if(!list)return;

function showCtx(x,y,items){
  ctxMenu.innerHTML='';
  items.forEach(it=>{
    if(it==='sep'){const d=document.createElement('div');d.className='ctx-sep';ctxMenu.appendChild(d);}
    else if(it.slider){
      const fmt=it.fmt||(v=>Math.round(v*100)+'%');
      const d=document.createElement('div');d.className='ctx-slider';
      const lab=document.createElement('div');lab.className='ctx-slabel';
      const t=document.createElement('span');t.textContent=it.label;
      const val=document.createElement('span');val.className='ctx-sval';val.textContent=fmt(+it.value);
      lab.appendChild(t);lab.appendChild(val);
      const rng=document.createElement('input');
      rng.type='range';rng.min=it.min;rng.max=it.max;rng.step=it.step;rng.value=it.value;
      rng.oninput=()=>{val.textContent=fmt(+rng.value);it.oninput(+rng.value);};
      // keep the menu open while dragging the bar
      d.addEventListener('mousedown',ev=>ev.stopPropagation());
      d.appendChild(lab);d.appendChild(rng);
      ctxMenu.appendChild(d);
    }
    else{
      const d=document.createElement('div');d.className='ctx-item'+(it.danger?' danger':'');
      d.innerHTML=(it.icon?it.icon+' ':'')+'<span>'+esc(it.label)+'</span>';
      d.onclick=()=>{hideCtx();it.action();};
      ctxMenu.appendChild(d);
    }
  });
  ctxMenu.style.left=x+'px';ctxMenu.style.top=y+'px';ctxMenu.style.display='block';
  // Adjust if overflow
  requestAnimationFrame(()=>{
    const r=ctxMenu.getBoundingClientRect();
    if(r.right>window.innerWidth)ctxMenu.style.left=(x-r.width)+'px';
    if(r.bottom>window.innerHeight)ctxMenu.style.top=(y-r.height)+'px';
  });
}
function hideCtx(){ctxMenu.style.display='none';}

// カードを最背面へ。重なり順は S.cards の配列順（先頭ほど後ろに描画）なので先頭へ移動する。
function sendCardToBack(id){
  const i=S.cards.findIndex(c=>c.id===id);
  if(i<=0)return;                       // 見つからない or すでに最背面
  const [c]=S.cards.splice(i,1);
  S.cards.unshift(c);
  // renderCardDOMs は既存要素を並べ替えないため、生成済みDOMの重なり順も手動で即時反映
  const el=elems.querySelector(`.card[data-id="${id}"]`);
  if(el){ const first=elems.querySelector('.card[data-id]'); if(first&&first!==el)elems.insertBefore(el,first); }
  scheduleCommit();                     // 並びを保存（リロード/ボード再描画後も最背面を維持）
}
// カードを最前面へ。S.cards 末尾ほど前面に描画されるので末尾へ移動する。
function sendCardToFront(id){
  const i=S.cards.findIndex(c=>c.id===id);
  if(i<0||i===S.cards.length-1)return;  // 見つからない or すでに最前面
  const [c]=S.cards.splice(i,1);
  S.cards.push(c);
  // 生成済みDOMも最後のカードの直後へ移動して即時反映
  const el=elems.querySelector(`.card[data-id="${id}"]`);
  if(el){ const cards=elems.querySelectorAll('.card[data-id]'); const last=cards[cards.length-1]; if(last&&last!==el)elems.insertBefore(el,last.nextSibling); }
  scheduleCommit();                     // 並びを保存（リロード/ボード再描画後も最前面を維持）
}

    {icon:'🏠',label:'ビューをリセット',action:()=>{S.zoom=1;S.panX=60;S.panY=60;applyTf();}}
  ]);
}

function zoomAt(sx,sy,factor){
  const r=wrap.getBoundingClientRect();
  const mx=sx-r.left,my=sy-r.top;
  const newZoom=Math.max(.1,Math.min(5,S.zoom*factor));
  S.panX=mx-(mx-S.panX)/S.zoom*newZoom;
  S.panY=my-(my-S.panY)/S.zoom*newZoom;
  S.zoom=newZoom;applyTf();
}

const touchDist=(a,b)=>Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY);
let _tPan=null,_pinch=null;
// canvas pan (1 finger) + pinch zoom (2 fingers)
wrap.addEventListener('touchstart',e=>{
  if(e.touches.length===2){
    e.preventDefault();_tPan=null;
    const[a,b]=e.touches;
    _pinch={d:touchDist(a,b)};
  } else if(e.touches.length===1){
    const t=e.touches[0];
    if(t.target.closest&&t.target.closest('.card,.branch,.subtitle,.imgel,.desc-box,.card-add-btn,.alabel,.ahit'))return; // element handles itself
    e.preventDefault();
    if(S.connecting){cancelConnect();}
    clearSelection();
    _tPan={sx:t.clientX,sy:t.clientY,px:S.panX,py:S.panY};_pinch=null;
  }
},{passive:false});
wrap.addEventListener('touchmove',e=>{
  if(_pinch&&e.touches.length===2){
    e.preventDefault();
    const[a,b]=e.touches;const nd=touchDist(a,b);
    const f=nd/_pinch.d;_pinch.d=nd;
    zoomAt((a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2,f);
  } else if(_tPan&&e.touches.length===1){
    e.preventDefault();
    const t=e.touches[0];
    S.panX=_tPan.px+(t.clientX-_tPan.sx);S.panY=_tPan.py+(t.clientY-_tPan.sy);applyTf();
  }
},{passive:false});
const endTouchPan=e=>{ if(e.touches.length===0){_tPan=null;_pinch=null;} else if(e.touches.length<2)_pinch=null; };
wrap.addEventListener('touchend',endTouchPan);
wrap.addEventListener('touchcancel',endTouchPan);

// element touch: tap=edit, drag=move, long-press=menu, (while connecting) tap=connect
function openEditorForElement(id,x,y){
  if(cardById(id))openCardEditor(id);
  else if(branchById(id))openBranchEditor(id);
  else if(S.subtitles.find(s=>s.id===id))openSubtitleEditor(id);
  else if(S.images.find(i=>i.id===id))onImageCtx({clientX:x,clientY:y,preventDefault(){},stopPropagation(){}},id);
}
function openCtxForElement(id,x,y){
  const fake={clientX:x,clientY:y,preventDefault(){},stopPropagation(){}};
  if(cardById(id))onCardCtx(fake,id);
  else if(branchById(id))onBranchCtx(fake,id);
  else if(S.subtitles.find(s=>s.id===id))onSubtitleCtx(fake,id);
  else if(S.images.find(i=>i.id===id))onImageCtx(fake,id);
}
function elementTouchStart(e,id){
  if(e.touches.length!==1)return;
  e.stopPropagation();e.preventDefault();
  if(S.connecting){ if(S.connecting.fromId!==id){createArrow(S.connecting.fromId,id);S.connecting=null;render();} return; }
  const t=e.touches[0];const sx=t.clientX,sy=t.clientY;
  const node=selById(id);if(!node)return;
  const ox=node.x,oy=node.y;
  let moved=false,longFired=false;
  const lp=setTimeout(()=>{ if(!moved){longFired=true;cleanup();openCtxForElement(id,sx,sy);} },480);
  const move=(cx,cy)=>{
    if(longFired)return;
    if(!moved&&(Math.abs(cx-sx)>7||Math.abs(cy-sy)>7)){moved=true;clearTimeout(lp);}
    if(moved){
      const sp=s2c(sx,sy),cp=s2c(cx,cy);
      node.x=clampW(ox+(cp.x-sp.x));node.y=clampW(oy+(cp.y-sp.y));
      const el=elems.querySelector(`[data-id="${id}"]`);if(el){el.style.left=node.x+'px';el.style.top=node.y+'px';}
      renderArrows();renderLabels();renderZones();renderDescs();
    }
  };
  const tm=ev=>{if(ev.touches[0]){ev.preventDefault();move(ev.touches[0].clientX,ev.touches[0].clientY);}};
  const te=()=>{cleanup();if(longFired)return;if(!moved)openEditorForElement(id,sx,sy);else scheduleCommit();};
  function cleanup(){clearTimeout(lp);window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);window.removeEventListener('touchcancel',te);}
  window.addEventListener('touchmove',tm,{passive:false});window.addEventListener('touchend',te);window.addEventListener('touchcancel',te);
}
function connectTouchStart(e,fromId){
  if(e.touches.length!==1)return;
  e.stopPropagation();e.preventDefault();
  S.connecting={fromId};S.mouse=s2c(e.touches[0].clientX,e.touches[0].clientY);render();
  const tm=ev=>{if(ev.touches[0]){ev.preventDefault();S.mouse=s2c(ev.touches[0].clientX,ev.touches[0].clientY);updateTempArrow();}};
  const te=ev=>{
    window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);
    const ch=ev.changedTouches[0];
    const tgt=ch?document.elementFromPoint(ch.clientX,ch.clientY):null;
    const host=tgt&&tgt.closest&&tgt.closest('.card,.branch');
    if(host&&host.dataset.id&&host.dataset.id!==fromId)createArrow(fromId,host.dataset.id);
    S.connecting=null;render();
  };
  window.addEventListener('touchmove',tm,{passive:false});window.addEventListener('touchend',te);
}
function descTouchStart(e,id){
  if(e.touches.length!==1)return;
  const tag=e.target.closest&&e.target.closest('.layer-tag');
  if(tag){e.stopPropagation();e.preventDefault();jumpToLayer(tag.dataset.layer,tag.dataset.card);return;} // tap tag → jump to that layer's canvas
  e.stopPropagation();e.preventDefault();
  const owner=ownerByDescId(id);if(!owner)return;const kind=descKindOf(id);
  const dbox=elems.querySelector(`.desc-box[data-desc-id="${id}"]`);
  const a=descAnchor(owner,kind)||{x:0,y:0};
  const off0=(owner.descMoved&&owner.descOff)?{x:owner.descOff.x,y:owner.descOff.y}
            :{x:(parseFloat(dbox&&dbox.style.left)||a.x)-a.x, y:(parseFloat(dbox&&dbox.style.top)||a.y)-a.y};
  const start=s2c(e.touches[0].clientX,e.touches[0].clientY);
  const tm=ev=>{if(ev.touches[0]){ev.preventDefault();const cp=s2c(ev.touches[0].clientX,ev.touches[0].clientY);owner.descMoved=true;owner.descOff={x:clampW(off0.x+(cp.x-start.x)),y:clampW(off0.y+(cp.y-start.y))};renderDescs();}};
  const te=()=>{window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);scheduleCommit();};
  window.addEventListener('touchmove',tm,{passive:false});window.addEventListener('touchend',te);
}
// delegate element touches on the canvas layer
elems.addEventListener('touchstart',e=>{
  const t=e.target;
  const addBtn=t.closest&&t.closest('.card-add-btn');
  if(addBtn){const host=addBtn.closest('.card,.branch');if(host)connectTouchStart(e,host.dataset.id);return;}
  const lb=t.closest&&t.closest('.link-badge');
  if(lb){e.stopPropagation();e.preventDefault();const host=lb.closest('.card');const c=host&&cardById(host.dataset.id);if(c&&c.linkBoard)openLinkBoard(c.linkBoard);return;}
  const descBox=t.closest&&t.closest('.desc-box');
  if(descBox){descTouchStart(e,descBox.dataset.descId);return;}
  const el=t.closest&&t.closest('.card,.branch,.subtitle,.imgel');

},{passive:false});

// list-item touch: vertical swipe = scroll the panel; horizontal drag = onto canvas; tap = the item's onclick
// (no touchstart preventDefault → panel scroll & tap-click work)
function listDragTouch(e,onDrop){
  if(e.touches.length!==1)return;
  const t=e.touches[0];const sx=t.clientX,sy=t.clientY;let drag=false,decided=false;
  const tm=ev=>{ if(!ev.touches[0])return;
    const dx=ev.touches[0].clientX-sx,dy=ev.touches[0].clientY-sy;
    if(!decided){ if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>6)decided=true; else if(Math.abs(dx)>8){decided=true;drag=true;} }
    if(drag)ev.preventDefault();
  };
  const te=ev=>{ window.removeEventListener('touchmove',tm);window.removeEventListener('touchend',te);
    if(drag){const ch=ev.changedTouches[0];const r=wrap.getBoundingClientRect();
      if(ch&&ch.clientX>=r.left&&ch.clientX<=r.right&&ch.clientY>=r.top&&ch.clientY<=r.bottom)onDrop(s2c(ch.clientX,ch.clientY));}
  };
  window.addEventListener('touchmove',tm,{passive:false});window.addEventListener('touchend',te);
}
function clueTouchStart(e,clueId){ listDragTouch(e,pt=>placeClueOnCanvas(clueId,pt.x,pt.y)); } // tap → onclick (edit)
function questionTouchStart(e,qid){ listDragTouch(e,pt=>placeQuestionOnCanvas(qid,pt.x,pt.y)); } // drag → link node; tap → onclick (open board)
// card list touch: long-press → reorder (up/down); horizontal drag → place on canvas; vertical → scroll; tap → onclick
function cardListTouchStart(e, it){
  if(e.touches.length!==1)return;
  const cardId=it.dataset.cardId, fromBoard=it.dataset.cardBoard, key=it.dataset.cardkey;
  const src = fromBoard===S.currentBoard ? cardById(cardId)
            : ((S.boards[fromBoard]&&S.boards[fromBoard].cards||[]).find(c=>c.id===cardId));
  const t0=e.touches[0], sx=t0.clientX, sy=t0.clientY;
  let mode=null; // null | 'scroll' | 'canvas' | 'reorder'
  const under=(x,y)=>{const el=document.elementFromPoint(x,y);return el&&el.closest&&el.closest('.clue-item[data-card-id]');};
  const lp=setTimeout(()=>{ if(mode===null){ mode='reorder'; it.classList.add('q-dragging'); try{navigator.vibrate&&navigator.vibrate(12);}catch(_){ } } },340); // hold to pick up
  const tm=ev=>{ const t=ev.touches[0]; if(!t)return;
    const dx=t.clientX-sx, dy=t.clientY-sy;
    if(mode===null){
      if(Math.abs(dx)>8&&Math.abs(dx)>=Math.abs(dy)){ mode='canvas'; clearTimeout(lp); }   // horizontal → canvas
      else if(Math.abs(dy)>8){ mode='scroll'; clearTimeout(lp); }                          // vertical → scroll
    }
    if(mode==='canvas'){ ev.preventDefault(); }
    else if(mode==='reorder'){ ev.preventDefault();
      const over=under(t.clientX,t.clientY); clearDropMarks();
      if(over&&over!==it){ const r=over.getBoundingClientRect(); over.classList.add(t.clientY>r.top+r.height/2?'q-over-bottom':'q-over-top'); }
    }
  };
  const te=ev=>{ clearTimeout(lp);
    window.removeEventListener('touchmove',tm); window.removeEventListener('touchend',te);
    it.classList.remove('q-dragging');
    const ch=ev.changedTouches[0];
    if(mode==='canvas'&&src&&ch){ const r=wrap.getBoundingClientRect();
      if(ch.clientX>=r.left&&ch.clientX<=r.right&&ch.clientY>=r.top&&ch.clientY<=r.bottom){ const pt=s2c(ch.clientX,ch.clientY); placeCardOnCanvas(src,fromBoard,pt.x,pt.y); } }
    else if(mode==='reorder'){ if(ev.cancelable)ev.preventDefault(); // suppress the tap-click after a reorder
      const over=ch&&under(ch.clientX,ch.clientY); clearDropMarks();
      if(over&&over!==it&&over.dataset.cardkey){ const r=over.getBoundingClientRect(); const after=ch.clientY>r.top+r.height/2; moveCard(key,over.dataset.cardkey,after); } }
  };
  window.addEventListener('touchmove',tm,{passive:false}); window.addEventListener('touchend',te);
}

// Keyboard
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    cancelConnect();
    if(S.mode==='branch'){S.mode='normal';document.getElementById('btn-branch-mode').classList.remove('active');render();}
    return;
  }
  // ignore shortcuts while typing in a field / modal input
  const t=e.target, tag=(t&&t.tagName)||'';
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(tag)||(t&&t.isContentEditable))return;
  if(!(e.ctrlKey||e.metaKey))return;
  const k=e.key.toLowerCase();
  if(k==='z'&&!e.shiftKey){e.preventDefault();undo();}
  else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();} // Ctrl+Y or Ctrl+Shift+Z
  else if(k==='b'){e.preventDefault();addCard();}                      // new card
  else if(k==='s'){e.preventDefault();saveFile();}                     // save
});

// ── SAVE ──
function saveFile(){
  saveActiveBoard();
  const data={
    title:'ClueBoard',
    version:2,
    bg:S.bg,showDesc:S.showDesc,boardMode:S.boardMode,
    docTitle:S.docTitle,
    currentBoard:S.currentBoard,
    layers:S.layers,
    chapters:S.chapters,chapter:S.chapter,
    questions:S.questions,
    clues:S.clues,
    cardOrder:S.cardOrder,
    showMain:S.showMain,
    showCards:S.showCards,showLayers:S.showLayers,
    showQuestions:S.showQuestions,
    showClues:S.showClues,
    boards:S.boards,
    // also include the active board's arrays flat for older readers
    cards:S.cards,arrows:S.arrows,branches:S.branches,
    zones:S.zones,subtitles:S.subtitles,images:S.images
  };
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  const safe=(S.docTitle||'').trim().replace(/[\\/:*?"<>|\n\r\t]/g,'_').replace(/\s+/g,'_').slice(0,80);
  a.download=(safe||('relationship_'+(new Date().toISOString().slice(0,10))))+'.json';
  a.click();URL.revokeObjectURL(a.href);
}

// document title (top-left) → kept in S.docTitle and used as the save filename
(function wireDocTitle(){
  const inp=document.getElementById('doc-title'); if(!inp)return;

  inp.addEventListener('input',()=>{ S.docTitle=inp.value; autosaveLocalDebounced(); cloudSaveDebounced(); });

})();

// Apply a saved document object to the app state (shared by file-load and cloud-load)
function applyDocData(d){
  _loadingDoc=true;
  S.bg=d.bg||'grid';
  S.showDesc=d.showDesc!==false;
  S.boardMode=!!d.boardMode; _ropes.clear();
  S.clues=d.clues||[];
  S.cardOrder=d.cardOrder||[];
  S.chapters=(Array.isArray(d.chapters)&&d.chapters.length)?d.chapters.slice():['1章'];
  S.chapter=(d.chapter&&(d.chapter==='__all'||S.chapters.includes(d.chapter)))?d.chapter:S.chapters[0];
  S.docTitle=d.docTitle||'';
  const _dt=document.getElementById('doc-title'); if(_dt)_dt.value=S.docTitle;
  S.showMain=d.showMain!==false;
  S.showCards=d.showCards!==false; S.showLayers=d.showLayers!==false;
  S.showQuestions=d.showQuestions!==false;
  S.showClues=d.showClues!==false;
  if(d.boards){
    S.boards=d.boards;
    S.questions=d.questions||[];
    S.currentBoard=(d.currentBoard&&d.boards[d.currentBoard])?d.currentBoard:'main';
    if(!S.boards.main)S.boards.main=BLANK_BOARD();
  } else {
    S.boards={main:{cards:d.cards||[],arrows:d.arrows||[],branches:d.branches||[],zones:d.zones||[],subtitles:d.subtitles||[],images:d.images||[]}};
    S.questions=[]; S.currentBoard='main';
  }
  // time-series layers are a global list of canvases; migrate older docs (mainTitle → レイヤー1)
  S.layers=Array.isArray(d.layers)?d.layers.slice():[];
  ensureLayers(d.mainTitle);
  if(!S.layers.some(l=>l.id===S.currentBoard) && !S.questions.some(q=>q.id===S.currentBoard)) S.currentBoard='main';
  // 属性マイグレーション: 旧データに attr を付与（リンクノード=疑問 / 手がかり由来・同名=手がかり / それ以外=人物）。手がかりは🔑必須
  {
    const clueNames=new Set(S.clues.map(c=>(c.name||'').trim()).filter(Boolean));
    Object.values(S.boards).forEach(bd=>(bd.cards||[]).forEach(c=>{
      if(!c.attr)c.attr=c.linkBoard?'question':((c.fromClue||clueNames.has((c.name||'').trim()))?'clue':'person');
      if(c.attr==='clue')c.key=true;
    }));
    S.clues.forEach(c=>{ c.key=true; if(!c.attr)c.attr='clue'; });
  }
  loadActiveBoard();
  document.getElementById('bg-sel').value=S.bg;
  document.getElementById('btn-toggle-desc').classList.toggle('active',S.showDesc);
  render();applyTf();renderSidebar();resetHistory();
  const bmBtn=document.getElementById('btn-board-mode'); if(bmBtn)bmBtn.classList.toggle('active',S.boardMode);
  if(S.boardMode)startRopePhysics(); else stopRopePhysics();
  _loadingDoc=false;
}
function currentDocData(){
  saveActiveBoard();
  return {title:'ClueBoard',version:2,bg:S.bg,showDesc:S.showDesc,boardMode:S.boardMode,currentBoard:S.currentBoard,layers:S.layers,
    chapters:S.chapters,chapter:S.chapter,
    questions:S.questions,clues:S.clues,cardOrder:S.cardOrder,docTitle:S.docTitle,showMain:S.showMain,showCards:S.showCards,showLayers:S.showLayers,showQuestions:S.showQuestions,showClues:S.showClues,boards:S.boards};
}

document.getElementById('btn-load').onclick=()=>document.getElementById('file-input').click();
document.getElementById('file-input').onchange=e=>{
  const f=e.target.files[0];if(!f)return;

  r.onload=ev=>{ try{ applyDocData(JSON.parse(ev.target.result)); }catch(err){alert('読み込みエラー: '+err.message);} };

};

let fbAuth=null, fbDb=null, fbUser=null, cloudDocId=null, _cloudTimer=null;

    });
    fbAuth=firebase.auth(); fbDb=firebase.firestore();
    fbAuth.onAuthStateChanged(onAuthChanged);
    // handle returning from a redirect sign-in (mobile)
    fbAuth.getRedirectResult&&fbAuth.getRedirectResult().catch(()=>{});
  }catch(e){ console.warn('Firebase init failed',e); }
})();
function cloudReady(){return !!(fbAuth&&fbDb);}
function setCloudStatus(t){const s=document.getElementById('cloud-status');if(s)s.textContent=t||'';}
function hashDocId(){return (location.hash.match(/doc=([\w-]+)/)||[])[1]||null;}
function updateCloudUI(){
  const lb=document.getElementById('btn-login'),sb=document.getElementById('btn-share');
  if(!lb)return;
  if(!cloudReady()){lb.textContent='👤 ログイン(未設定)';lb.disabled=true;if(sb)sb.disabled=true;return;}
  if(fbUser){
    const nm=(fbUser.displayName||'ユーザー').split(' ')[0];
    lb.textContent='👤 '+nm+'（ログアウト）';lb.classList.add('in');lb.title='クリックでログアウト';
    if(sb)sb.disabled=false;
  } else {
    lb.textContent='👤 Googleでログイン';lb.classList.remove('in');lb.title='';
    if(sb)sb.disabled=true; setCloudStatus('');
  }
}
let _loginPromptShown=false;
function promptLogin(){
  if(!cloudReady()||fbUser)return;
  showModal(`<h2>👤 Googleでログイン</h2>
    <div class="fg" style="color:#cfcfe6;font-size:13px;line-height:1.7">ログインすると、作った図が<b>クラウドに自動保存</b>され、<b>共有リンク</b>で他の人と同じ図を編集できます。<br>ログインせずローカルのまま使うこともできます。</div>
    <div class="mact">
      <button class="btn btn-s" onclick="hideModal()">ログインせずに使う</button>
      <button class="btn btn-p" id="lp-login">Googleでログイン</button>
    </div>`,()=>{
    document.getElementById('lp-login').onclick=()=>{hideModal();cloudLogin();};
  });
}
function onAuthChanged(user){
  fbUser=user||null; updateCloudUI();
  if(user){
    const h=hashDocId();
    cloudDocId = h || user.uid;
    cloudLoad(cloudDocId, !h); // own doc auto-created if missing; shared doc must exist
  } else {
    cloudDocId=null;
    // not signed in → prompt the Google login once (the actual popup opens on the button = reliable across browsers)
    if(!_loginPromptShown){ _loginPromptShown=true; setTimeout(promptLogin,300); }
  }
}
function cloudLogin(){
  if(!cloudReady())return alert('Firebaseが読み込まれていません（オフライン/ファイル直開きでは利用できません）。公開URLで試してください。');
  const p=new firebase.auth.GoogleAuthProvider();
  fbAuth.signInWithPopup(p).catch(err=>{
    if(err&&/popup|cancelled|disallowed/i.test((err.code||'')+(err.message||''))){ try{fbAuth.signInWithRedirect(p);}catch(_){ alert('ログイン失敗: '+(err.message||err)); } }
    else alert('ログイン失敗: '+(err.message||err));
  });
}
function cloudLoad(docId, createIfMissing){
  if(!cloudReady())return;
  setCloudStatus('☁ 読込中…');
  fbDb.collection('docs').doc(docId).get().then(snap=>{
    if(snap.exists && snap.data() && snap.data().data){ applyDocData(snap.data().data); setCloudStatus('☁ 読込完了'); }
    else if(createIfMissing){ cloudSaveNow(); }   // first sign-in → push current work as your doc
    else { setCloudStatus('⚠ 共有データが見つかりません'); }
  }).catch(e=>{ setCloudStatus('☁ 読込失敗'); console.warn('cloudLoad',e); });
}
function cloudSaveNow(){
  if(!cloudReady()||!fbUser||!cloudDocId)return;
  setCloudStatus('☁ 保存中…');
  const payload={ lastEditor:fbUser.uid, updatedAt:firebase.firestore.FieldValue.serverTimestamp(), data:currentDocData() };
  if(cloudDocId===fbUser.uid)payload.owner=fbUser.uid;
  fbDb.collection('docs').doc(cloudDocId).set(payload,{merge:true})
    .then(()=>setCloudStatus('☁ 保存済み'))
    .catch(e=>{setCloudStatus('☁ 保存失敗');console.warn('cloudSave',e);});
}
function cloudSaveDebounced(){
  if(_loadingDoc||!cloudReady()||!fbUser||!cloudDocId)return;
  clearTimeout(_cloudTimer); _cloudTimer=setTimeout(cloudSaveNow,2000);
}
function cloudShare(){
  if(!fbUser||!cloudDocId){alert('共有するにはログインしてください');return;}
  const url=location.origin+location.pathname+'#doc='+cloudDocId;
  cloudSaveNow();
  if(navigator.clipboard&&navigator.clipboard.writeText){
    navigator.clipboard.writeText(url).then(()=>setCloudStatus('🔗 共有リンクをコピーしました'),()=>{});
  }
  prompt('この共有リンクを相手に渡してください（相手もGoogleログインで同じ図を編集できます）:', url);
}
document.getElementById('btn-login').onclick=()=>{ if(fbUser)fbAuth.signOut(); else cloudLogin(); };
document.getElementById('btn-share').onclick=cloudShare;
window.addEventListener('hashchange',()=>{ if(fbUser){ const h=hashDocId(); if(h&&h!==cloudDocId){ cloudDocId=h; cloudLoad(h,false);} } });
updateCloudUI();

// ═══════════════════════════════════════
//  BOOT SCREEN (GameCube-style intro)
// ═══════════════════════════════════════
(function boot(){
  const screen=document.getElementById('boot-screen');
  if(!screen)return;
  let gone=false,actx=null,played=false;
  function remove(skip){
    if(gone)return;gone=true;
    if(skip)screen.classList.add('skip');
    setTimeout(()=>screen.remove(),skip?380:60);
  }
  // GameCube-ish chime: low thud + shimmering rising arpeggio. Fires once, as soon as audio is allowed.
  function chime(){
    if(played)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
      if(!actx)actx=new AC();
      if(actx.state==='suspended')actx.resume();
      if(actx.state!=='running')return; // autoplay blocked — retry on next user gesture
      played=true;
      const ctx=actx,t0=ctx.currentTime+0.03;
      const master=ctx.createGain();master.connect(ctx.destination);
      master.gain.setValueAtTime(0.0001,t0);
      master.gain.exponentialRampToValueAtTime(0.5,t0+0.05);
      master.gain.exponentialRampToValueAtTime(0.18,t0+1.6);
      master.gain.exponentialRampToValueAtTime(0.0001,t0+2.7);
      const lo=ctx.createOscillator(),lg=ctx.createGain();
      lo.type='sine';lo.frequency.setValueAtTime(120,t0);lo.frequency.exponentialRampToValueAtTime(48,t0+0.5);
      lg.gain.setValueAtTime(0.6,t0);lg.gain.exponentialRampToValueAtTime(0.001,t0+0.6);
      lo.connect(lg);lg.connect(master);lo.start(t0);lo.stop(t0+0.7);
      const notes=[392,523.25,587.33,783.99,880,1046.5];
      notes.forEach((f,i)=>{
        const st=t0+0.18+i*0.12;
        ['triangle','sine'].forEach((tp,k)=>{
          const o=ctx.createOscillator(),g=ctx.createGain();
          o.type=tp;o.frequency.value=f*(k?2:1);
          g.gain.setValueAtTime(0.0001,st);
          g.gain.exponentialRampToValueAtTime(k?0.06:0.16,st+0.04);
          g.gain.exponentialRampToValueAtTime(0.0001,st+1.1);
          o.connect(g);g.connect(master);o.start(st);o.stop(st+1.2);
        });
      });
    }catch(e){}
  }
  // Audio needs a user gesture (browser autoplay policy) — create the context only then.
  const kick=()=>{chime();if(played){window.removeEventListener('pointerdown',kick);window.removeEventListener('keydown',kick);}};
  window.addEventListener('pointerdown',kick);
  window.addEventListener('keydown',kick);
  // dismiss: click to skip, or auto after the animation
  screen.addEventListener('click',()=>{chime();remove(true);});
  setTimeout(()=>remove(false),4700);
})();
</script>
